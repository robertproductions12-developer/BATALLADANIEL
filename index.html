<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel: El Desafío Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        /* Botones Premium */
        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,255,255,0.5);
            border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-gold:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(191, 149, 63, 0.4); }
        .btn-gold:active { transform: translateY(0); }

        .btn-option {
            background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-option:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }

        .card-glass { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        /* Cuadros de Nivel 16:9 */
        .level-card { 
            position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 1.5rem;
            cursor: pointer; transition: all 0.6s ease; border: 2px solid rgba(212, 175, 55, 0);
        }
        .level-card.locked { filter: grayscale(1) brightness(0.2); pointer-events: none; }
        .level-card.active { filter: grayscale(0) brightness(1.1); border-color: var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
        .level-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .level-overlay-num { 
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 5rem; font-family: 'Cinzel'; color: rgba(255,255,255,0.15); font-weight: 900;
        }

        .hidden { display: none !important; }
        .progress-line { transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1); }

        /* Video Victory */
        #victory-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 100; background: black; }
    </style>
</head>
<body>

    <!-- VIDEO DE VICTORIA (OCULTO POR DEFECTO) -->
    <div id="view-victory" class="hidden fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black">
        <video id="vid-player" playsinline>
            <source src="" type="video/mp4">
        </video>
        <div class="absolute bottom-10 z-[210]">
            <button onclick="backToCamp()" class="btn-gold px-12 py-4 rounded-full text-xl">Volver al Campamento</button>
        </div>
    </div>

    <!-- 1. LOGIN -->
    <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900 to-black">
        <h1 class="font-royal text-7xl mb-2 text-yellow-500 drop-shadow-2xl">DANIEL</h1>
        <p class="text-sm tracking-[0.6em] mb-16 text-zinc-500 uppercase">El Desafío de los Reinos</p>
        
        <div class="card-glass p-10 rounded-[2rem] w-full max-w-md">
            <input type="text" id="login-name" placeholder="Escribe tu Nombre" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl mb-5 text-center text-xl outline-none focus:border-yellow-600 transition-colors shadow-inner">
            <div id="admin-pass-container" class="hidden">
                <input type="password" id="login-pass" placeholder="Clave de Mando" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl mb-5 text-center outline-none">
            </div>
            <button onclick="handleAuth()" class="btn-gold w-full py-5 rounded-2xl text-xl tracking-tighter">Comenzar</button>
            <button onclick="toggleAdminField()" class="text-[10px] mt-8 text-zinc-700 underline uppercase block mx-auto tracking-widest">Acceso Jerárquico</button>
        </div>
    </div>

    <!-- 2. MAPA DE NIVELES -->
    <div id="view-levels" class="hidden min-h-screen p-6 md:p-12">
        <header class="flex justify-between items-end mb-12 max-w-7xl mx-auto">
            <div>
                <p id="player-welcome" class="text-zinc-500 text-xs tracking-widest uppercase mb-1"></p>
                <h2 class="font-royal text-4xl text-yellow-500">Misiones Disponibles</h2>
            </div>
            <button onclick="location.reload()" class="bg-zinc-900 text-zinc-400 px-6 py-2 rounded-xl text-xs font-bold border border-zinc-800 hover:text-red-500 transition">ABANDONAR</button>
        </header>
        
        <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"></div>
    </div>

    <!-- 3. LOBBY / CHAT EN VIVO -->
    <div id="view-lobby" class="hidden min-h-screen flex flex-col p-6 max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <button onclick="showView('levels')" class="bg-zinc-900 p-3 rounded-full text-yellow-600">←</button>
            <h2 id="lobby-title" class="font-royal text-2xl text-yellow-500 tracking-widest"></h2>
            <div class="w-10"></div>
        </header>

        <div class="flex-1 card-glass rounded-3xl p-6 mb-6 overflow-y-auto" id="chat-messages"></div>

        <div class="flex gap-3 mb-8">
            <input type="text" id="chat-input" placeholder="Mensaje para los profetas..." class="flex-1 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none focus:border-yellow-600 text-sm">
            <button onclick="sendChatMessage()" class="btn-gold px-8 rounded-2xl font-royal">Enviar</button>
        </div>

        <div class="text-center p-10 border-2 border-dashed border-yellow-900/30 rounded-[2.5rem] bg-yellow-900/5">
            <p class="text-yellow-600 font-bold uppercase tracking-widest mb-2 animate-pulse">Sincronizando con el Administrador</p>
            <p class="text-[11px] text-zinc-500 italic">La batalla comenzará cuando el mando lo autorice...</p>
        </div>
    </div>

    <!-- 4. PANTALLA DE BATALLA (QUIZ) -->
    <div id="view-game" class="hidden min-h-screen flex flex-col p-6 max-w-md mx-auto justify-center">
        <div class="flex justify-between items-center mb-8">
            <div id="lives-display" class="flex gap-1 text-2xl drop-shadow-[0_0_15px_rgba(255,0,0,0.6)]"></div>
            <div class="text-right">
                <span id="score-display" class="text-3xl font-bold text-yellow-500 font-royal">0</span>
                <p class="text-[10px] uppercase text-zinc-600 tracking-widest">Puntos de Sabiduría</p>
            </div>
        </div>

        <div id="group-progress" class="mb-10 space-y-4"></div>

        <div class="card-glass p-8 rounded-[3rem] relative flex flex-col min-h-[500px] border-t-2 border-yellow-600/20">
            <p id="q-meta" class="text-[11px] text-yellow-600 font-bold mb-6 tracking-[0.2em] uppercase text-center border-b border-zinc-800 pb-4"></p>
            <h3 id="q-text" class="text-2xl font-semibold mb-12 leading-tight text-center px-2"></h3>
            
            <div id="options-grid" class="grid grid-cols-1 gap-4"></div>
            
            <div id="q-cite" class="mt-auto pt-10 text-[11px] italic text-zinc-600 text-center leading-relaxed"></div>
        </div>
    </div>

    <!-- 5. PANEL DE CONTROL (ADMIN) -->
    <div id="view-admin" class="hidden min-h-screen p-8 bg-zinc-950">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-12 border-b border-zinc-900 pb-8">
                <div>
                    <h2 class="font-royal text-5xl text-red-600 tracking-tighter">CENTRAL DE MANDO</h2>
                    <p class="text-[10px] text-zinc-600 uppercase tracking-[0.5em]">Operaciones de Batalla Daniel</p>
                </div>
                <button onclick="location.reload()" class="bg-red-950/20 border border-red-900 text-red-600 px-8 py-3 rounded-2xl font-bold hover:bg-red-600 hover:text-white transition-all shadow-lg">CERRAR SESIÓN</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <!-- Ajustes -->
                <div class="card-glass p-8 rounded-[2.5rem]">
                    <h3 class="font-royal text-yellow-600 text-xl mb-8">Ajustes del Reino</h3>
                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] uppercase text-zinc-500 font-bold mb-2 block">Seleccionar Misión</label>
                            <select id="adm-level" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-sm"></select>
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-zinc-500 font-bold mb-2 block">Dificultad (Vidas)</label>
                            <select id="adm-difficulty" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-sm">
                                <option value="10">Clemente (10 Vidas)</option>
                                <option value="5" selected>Prueba (5 Vidas)</option>
                                <option value="3">Castigo (3 Vidas)</option>
                                <option value="1">Juicio Final (1 Vida)</option>
                            </select>
                        </div>
                        <button id="btn-toggle-game" onclick="toggleGameState()" class="w-full py-6 rounded-3xl font-bold uppercase tracking-widest shadow-2xl transition-all text-sm"></button>
                        <button onclick="globalReset()" class="w-full text-[9px] text-zinc-700 uppercase hover:text-red-500 transition tracking-widest pt-4">Purgar todos los registros (Reset)</button>
                    </div>
                </div>

                <!-- Excel -->
                <div class="card-glass p-8 rounded-[2.5rem] flex flex-col justify-center text-center">
                    <h3 class="font-royal text-yellow-600 text-xl mb-8">Sabiduría (Excel)</h3>
                    <input type="file" id="adm-excel" accept=".xlsx" class="hidden" onchange="processExcel(this)">
                    <button onclick="document.getElementById('adm-excel').click()" class="w-full py-20 border-2 border-dashed border-zinc-800 rounded-[2rem] hover:border-yellow-600 transition-all group">
                        <span class="text-6xl group-hover:scale-110 transition block mb-4">📜</span>
                        <span class="text-xs uppercase text-zinc-500 group-hover:text-yellow-600 font-bold">Cargar Escrituras (Nivel)</span>
                    </button>
                </div>

                <!-- Monitor -->
                <div class="card-glass p-8 rounded-[2.5rem]">
                    <h3 class="font-royal text-yellow-600 text-xl mb-8">Guerreros Activos</h3>
                    <div id="adm-player-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE & CORE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, deleteDoc, query, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE (PEGAR AQUÍ)
        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
           authDomain: "batalladaniel-5ce50.firebaseapp.com",
           projectId: "batalladaniel-5ce50",
           storageBucket: "batalladaniel-5ce50.firebasestorage.app",
           messagingSenderId: "799596753792",
           appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // CONFIG GITHUB
        const baseImageUrl = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/niveles/nivel"; 
        const victoryVideoUrl = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/videos/victoria.mp4";

        let userState = { name: '', isAdmin: false, lives: 5, score: 0, currentQ: 0, dead: false };
        let gameState = { isStarted: false, level: 1, difficulty: 5 };
        let questions = [];

        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');

        // --- AUTH ---
        window.handleAuth = async () => {
            const name = document.getElementById('login-name').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if (!name) return Swal.fire("Identifícate", "El nombre es necesario para el registro.", "warning");

            if (name.toLowerCase() === 'admin' && pass === "Daniel777") {
                userState.isAdmin = true;
                initAdmin();
                return;
            }

            userState.name = name;
            document.getElementById('player-welcome').innerText = "PROFETA: " + name;
            
            await setDoc(doc(db, "participantes", name), {
                name, score: 0, lives: 5, qIndex: 0, dead: false, victory: false, lastSeen: Date.now()
            });

            showView('levels');
            renderLevelGrid();
            listenToGlobalSync();
            listenToChat();
        };

        // --- LEVELS ---
        function renderLevelGrid() {
            const grid = document.getElementById('level-grid');
            onSnapshot(doc(db, "config", "global"), (snap) => {
                const global = snap.data() || { level: 1 };
                grid.innerHTML = "";
                for(let i=1; i<=12; i++) {
                    const isActive = (i === global.level);
                    const card = document.createElement('div');
                    card.className = `level-card ${isActive ? 'active' : 'locked'}`;
                    card.innerHTML = `
                        <img src="${baseImageUrl}${i}.jpg" alt="Misión ${i}">
                        <div class="level-overlay-num">${isActive ? '' : i}</div>
                        ${isActive ? '<div class="absolute inset-0 bg-yellow-600/10 animate-pulse"></div>' : ''}
                        <div class="absolute top-4 left-4 text-[9px] font-bold text-white/40 tracking-[0.3em] uppercase">Misión ${i}</div>
                    `;
                    card.onclick = () => { if(isActive) { document.getElementById('lobby-title').innerText = "SALA DE PREPARACIÓN - NIVEL " + i; showView('lobby'); } };
                    grid.appendChild(card);
                }
            });
        }

        // --- SYNC ---
        function listenToGlobalSync() {
            onSnapshot(doc(db, "config", "global"), async (snap) => {
                const data = snap.data();
                if(!data) return;
                gameState = data;
                
                if(data.isStarted && !userState.dead && !userState.victory && (document.getElementById('view-lobby').offsetParent !== null)) {
                    userState.lives = data.difficulty;
                    await startLevel(data.level);
                } else if(!data.isStarted && (document.getElementById('view-game').offsetParent !== null)) {
                    showView('levels');
                }
            });

            onSnapshot(collection(db, "participantes"), (snap) => {
                const prog = document.getElementById('group-progress');
                if(!prog) return;
                prog.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    const per = (p.qIndex / 20) * 100;
                    prog.innerHTML += `
                        <div class="flex flex-col gap-1.5">
                            <div class="flex justify-between text-[8px] uppercase font-black tracking-widest ${p.dead ? 'text-red-700' : 'text-zinc-500'}">
                                <span>${p.name} ${p.victory ? '✅' : ''}</span> <span>${p.dead ? 'ELIMINADO' : p.qIndex+'/20'}</span>
                            </div>
                            <div class="h-[3px] bg-zinc-900 rounded-full overflow-hidden shadow-inner">
                                <div class="progress-line h-full ${p.dead ? 'bg-red-900' : 'bg-gradient-to-r from-yellow-700 to-yellow-400'}" style="width:${per}%"></div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // --- BATTLE ---
        async function startLevel(lvlNum) {
            const snap = await getDoc(doc(db, "niveles", "lvl_" + lvlNum));
            if(!snap.exists()) return Swal.fire("Vacio", "No hay escrituras para esta misión.", "error");
            
            questions = snap.data().questions.sort(() => Math.random() - 0.5).slice(0, 20);
            userState.currentQ = 0;
            userState.score = 0;
            userState.victory = false;
            showView('game');
            renderQuestion();
        }

        function renderQuestion() {
            if(userState.currentQ >= 20) {
                userState.victory = true;
                updateDoc(doc(db, "participantes", userState.name), { victory: true });
                playVictoryVideo();
                return;
            }

            const q = questions[userState.currentQ];
            document.getElementById('q-meta').innerText = `Misión ${gameState.level} - Desafío ${userState.currentQ + 1} / 20`;
            document.getElementById('q-text').innerText = q.Pregunta;
            document.getElementById('q-cite').innerText = q.Cita;
            document.getElementById('lives-display').innerHTML = "❤️".repeat(userState.lives);
            document.getElementById('score-display').innerText = userState.score;

            const opts = [q.Correcta, q.Inc1, q.Inc2, q.Inc3].sort(() => Math.random() - 0.5);
            const grid = document.getElementById('options-grid');
            grid.innerHTML = "";

            opts.forEach(o => {
                const b = document.createElement('button');
                b.className = "btn-option w-full p-5 rounded-2xl text-left text-xs font-bold uppercase tracking-tighter shadow-sm";
                b.innerText = o;
                b.onclick = () => {
                    const isCorrect = (o === q.Correcta);
                    b.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';
                    b.style.background = isCorrect ? '#14532d' : '#450a0a';
                    setTimeout(() => processAnswer(o, q.Correcta), 400);
                };
                grid.appendChild(b);
            });
        }

        async function processAnswer(sel, cor) {
            if(sel === cor) {
                userState.score += 100;
                userState.currentQ++;
            } else {
                userState.lives--;
                if(userState.lives <= 0) {
                    userState.dead = true;
                    showGameOver();
                }
            }
            if(!userState.dead) renderQuestion();
            updateDoc(doc(db, "participantes", userState.name), {
                score: userState.score, qIndex: userState.currentQ, dead: userState.dead, lives: userState.lives
            });
        }

        function playVictoryVideo() {
            const view = document.getElementById('view-victory');
            const vid = document.getElementById('vid-player');
            vid.src = victoryVideoUrl;
            view.classList.remove('hidden');
            vid.play();
        }

        window.backToCamp = () => {
            document.getElementById('view-victory').classList.add('hidden');
            document.getElementById('vid-player').pause();
            showView('lobby');
        };

        function showGameOver() {
            showView('login');
            Swal.fire({
                title: 'ELIMINADO', text: 'El león ha sido más rápido que tu sabiduría.',
                imageUrl: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnd4cmh6ZzR4ZWZ4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/3o7TKMGpxxS06TLLJC/giphy.gif',
                imageWidth: 300, background: '#000', color: '#fff', confirmButtonText: 'SALIR'
            }).then(() => location.reload());
        }

        // --- ADMIN ---
        function initAdmin() {
            showView('admin');
            const select = document.getElementById('adm-level');
            for(let i=1; i<=12; i++) select.innerHTML += `<option value="${i}">Misión ${i}</option>`;

            onSnapshot(doc(db, "config", "global"), (snap) => {
                const data = snap.data() || {};
                gameState = data;
                const btn = document.getElementById('btn-toggle-game');
                if(data.isStarted) {
                    btn.innerText = "Detener Batalla";
                    btn.className = "w-full py-6 rounded-3xl font-bold uppercase tracking-widest shadow-2xl transition-all text-sm bg-red-700 text-white";
                } else {
                    btn.innerText = "Iniciar Nivel " + (data.level || 1);
                    btn.className = "w-full py-6 rounded-3xl font-bold uppercase tracking-widest shadow-2xl transition-all text-sm btn-gold";
                }
            });

            onSnapshot(collection(db, "participantes"), (snap) => {
                const list = document.getElementById('adm-player-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-4 bg-black border border-zinc-900 rounded-2xl shadow-inner border-l-4 ${p.dead ? 'border-red-600' : 'border-green-600'}">
                            <div><p class="font-bold text-xs uppercase ${p.dead ? 'text-zinc-600' : ''}">${p.name} ${p.victory ? '🏆' : ''}</p><p class="text-[9px] text-zinc-500">Q: ${p.qIndex}/20 | Pts: ${p.score}</p></div>
                            <button onclick="kick('${p.name}')" class="text-red-900 text-[10px] font-black hover:text-red-500 transition">ELIMINAR</button>
                        </div>
                    `;
                });
            });
        }

        window.toggleGameState = async () => {
            const lvl = parseInt(document.getElementById('adm-level').value);
            const dif = parseInt(document.getElementById('adm-difficulty').value);
            await setDoc(doc(db, "config", "global"), {
                isStarted: !gameState.isStarted, level: lvl, difficulty: dif
            });
        };

        window.processExcel = (input) => {
            const lvl = document.getElementById('adm-level').value;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const book = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                await setDoc(doc(db, "niveles", "lvl_" + lvl), { questions: json });
                Swal.fire("Sincronizado", "Misión " + lvl + " cargada en la bóveda.", "success");
            };
            reader.readAsArrayBuffer(input.files[0]);
        };

        window.kick = async (n) => { if(confirm(`¿Expulsar a ${n}?`)) await deleteDoc(doc(db, "participantes", n)); };
        window.globalReset = async () => { if(confirm("¿Purgar todos los datos?")) { await setDoc(doc(db, "config", "global"), { isStarted: false, level: 1, difficulty: 5 }); } };

        // --- CHAT ---
        window.sendChatMessage = async () => {
            const i = document.getElementById('chat-input');
            if(!i.value) return;
            await addDoc(collection(db, "chat"), { user: userState.name, text: i.value, time: Date.now() });
            i.value = "";
        };

        function listenToChat() {
            const q = query(collection(db, "chat"), orderBy("time", "desc"), limit(25));
            onSnapshot(q, (snap) => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.user === userState.name;
                    box.innerHTML += `<div class="mb-5 ${isMe ? 'text-right' : 'text-left'}">
                        <span class="text-[9px] font-black uppercase text-zinc-600 block mb-1">${m.user}</span>
                        <span class="inline-block px-5 py-2 rounded-2xl text-xs shadow-sm ${isMe ? 'bg-yellow-600/20 text-yellow-200 border border-yellow-600/30' : 'bg-zinc-900 text-zinc-400 border border-zinc-800'}">${m.text}</span>
                    </div>`;
                });
            });
        }

        function showView(id) {
            ['view-login', 'view-levels', 'view-lobby', 'view-game', 'view-admin', 'view-victory'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById('view-' + id).classList.remove('hidden');
        }
    </script>
</body>
</html>
