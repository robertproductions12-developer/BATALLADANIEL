<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daniel: El Desafío Profético - Sistema de Salas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; height: 100vh; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        #video-bg-container { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: hidden; }
        #video-bg-container video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3); }

        #intro-overlay { position: fixed; inset: 0; z-index: 1000; background: black; display: flex; align-items: center; justify-content: center; transition: opacity 1s, visibility 1s; }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; }
        
        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); text-transform: uppercase;
        }
        
        .card-glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .timer-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--gold); transition: width 0.1s linear; }

        .level-card { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 1.2rem; border: 2px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: 0.5s; filter: brightness(0.2) grayscale(1); }
        .level-card.active { filter: brightness(1) grayscale(0); border: 3px solid var(--gold); }

        .floating-btn {
            position: fixed; z-index: 500; cursor: pointer; width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--gold); background: rgba(0,0,0,0.8);
            box-shadow: 0 0 15px var(--gold); color: var(--gold); font-size: 20px;
            animation: drift-down 15s linear infinite;
        }
        @keyframes drift-down {
            0% { transform: translateY(-120vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(120vh); opacity: 0; }
        }
        #f-btn-1 { left: 10%; animation-delay: 0s; }
        #f-btn-2 { left: 50%; animation-delay: 5s; }
        #f-btn-3 { left: 85%; animation-delay: 10s; }

        .status-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .tag-free { background: #064e3b; color: #34d399; }
        .tag-busy { background: #7f1d1d; color: #f87171; }
    </style>
</head>
<body id="game-body">

    <!-- BOTONES FLOTANTES -->
    <div id="floating-btns-group" class="hidden">
        <div id="f-btn-1" class="floating-btn" onclick="openFloatingCard('question')"><i class="fa-solid fa-question"></i></div>
        <div id="f-btn-2" class="floating-btn" onclick="openFloatingCard('book')"><i class="fa-solid fa-book-open"></i></div>
        <div id="f-btn-3" class="floating-btn" onclick="openFloatingCard('heart')"><i class="fa-solid fa-heart"></i></div>
    </div>

    <!-- MODAL FRASES -->
    <div id="floating-card-overlay" class="hidden fixed inset-0 z-[5000] bg-black/80 flex items-center justify-center p-6">
        <div class="card-glass p-8 rounded-[2.5rem] w-full max-w-sm text-center border-2 border-yellow-500/50">
            <div id="f-card-icon" class="text-5xl text-yellow-500 mb-6"></div>
            <p id="f-card-text" class="text-xl font-semibold mb-4 text-white"></p>
            <p id="f-card-sub" class="text-sm italic text-yellow-600 font-bold mb-8 uppercase"></p>
            <button onclick="document.getElementById('floating-card-overlay').classList.add('hidden')" class="btn-gold w-full py-3 rounded-xl">Cerrar</button>
        </div>
    </div>

    <div id="video-bg-container">
        <video id="bg-video-loop" loop playsinline muted><source src="intro.mp4" type="video/mp4"></video>
    </div>

    <div id="intro-overlay">
        <video id="intro-video" playsinline autoplay muted loop><source src="intro2.mp4" type="video/mp4"></video>
        <button onclick="endIntro()" class="absolute bottom-20 btn-gold px-12 py-5 rounded-full text-lg z-[1001]">Entrar a la Batalla</button>
    </div>

    <div id="main-content" class="relative z-10 opacity-0 transition-opacity duration-1000 h-screen flex flex-col">
        <div class="flex-grow overflow-y-auto">
            
            <!-- LOGIN -->
            <div id="view-login" class="min-h-full flex flex-col items-center justify-center p-6">
                <h1 class="font-royal text-6xl md:text-8xl mb-2 text-yellow-500 text-center drop-shadow-2xl uppercase">Daniel</h1>
                <p class="text-[10px] tracking-[0.6em] mb-12 text-zinc-400 uppercase text-center">El Desafío Profético</p>
                <div class="card-glass p-8 rounded-[2.5rem] w-full max-w-sm">
                    <input type="text" id="login-name" placeholder="Tu Nombre" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-white outline-none">
                    <input type="text" id="login-room-code" placeholder="Código de Sala" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-white outline-none">
                    
                    <button onclick="joinWithCode()" class="btn-gold w-full py-4 rounded-xl text-lg font-bold mb-4">Entrar a Batalla</button>
                    <button onclick="showView('rooms')" class="w-full py-3 rounded-xl text-zinc-400 border border-zinc-800 text-xs font-bold uppercase">Crear / Gestionar Sala</button>
                    
                    <div id="super-admin-link" class="mt-8 text-center">
                        <button onclick="toggleSuperAdminField()" class="text-[9px] text-zinc-700 uppercase tracking-widest underline">Administrador Supremo</button>
                        <div id="super-pass-container" class="hidden mt-4">
                            <input type="password" id="super-pass" placeholder="Clave Maestra" class="w-full bg-black border border-red-900/30 p-2 rounded text-center text-xs text-white outline-none">
                            <button onclick="handleSuperAuth()" class="mt-2 text-[10px] text-red-600 font-bold uppercase">Acceder al Trono</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SELECCIÓN DE SALAS (5 SALAS) -->
            <div id="view-rooms" class="hidden min-h-screen p-6">
                <h2 class="font-royal text-3xl text-yellow-500 text-center mb-8 uppercase">Salas Disponibles</h2>
                <div id="rooms-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto pb-20">
                    <!-- Dinámico -->
                </div>
                <button onclick="showView('login')" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-8 py-2 rounded-full border border-zinc-700 text-[10px]">REGRESAR</button>
            </div>

            <!-- NIVELES -->
            <div id="view-levels" class="hidden min-h-screen p-4">
                <header class="flex justify-between items-center mb-6 max-w-7xl mx-auto">
                    <div>
                        <h2 class="font-royal text-2xl text-white">MISIONES</h2>
                        <p id="info-current-room" class="text-[10px] text-yellow-600 font-bold uppercase"></p>
                    </div>
                    <div class="flex gap-2">
                        <button id="btn-admin-panel" onclick="showView('admin')" class="hidden bg-yellow-600/20 text-yellow-500 px-4 py-2 rounded-lg text-xs font-bold border border-yellow-600/50">ADMIN</button>
                        <button onclick="location.reload()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-lg text-xs font-bold border border-red-900/50">SALIR</button>
                    </div>
                </header>
                <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-7xl mx-auto pb-20"></div>
            </div>

            <!-- LOBBY -->
            <div id="view-lobby" class="hidden h-screen flex flex-col p-4 max-w-4xl mx-auto">
                <div class="card-glass p-4 rounded-2xl mb-3 shrink-0">
                    <div class="flex justify-between items-center">
                        <h2 id="lobby-title" class="font-royal text-xl text-yellow-500">LOBBY</h2>
                        <button onclick="showView('levels')" class="text-[10px] text-yellow-600 underline">Regresar</button>
                    </div>
                    <div id="lobby-pin-prompt" class="hidden mt-4 flex gap-2">
                        <input type="text" id="lobby-pin-input" placeholder="PIN DE NIVEL" class="flex-1 bg-black border border-yellow-600/30 p-3 rounded-xl text-center text-yellow-500 font-bold">
                        <button onclick="validateLobbyPin()" class="btn-gold px-6 rounded-xl text-xs">Entrar</button>
                    </div>
                </div>
                <div id="chat-messages" class="flex-1 card-glass rounded-2xl p-4 mb-3 overflow-y-auto text-xs"></div>
                <div class="card-glass p-2 rounded-2xl mb-3">
                    <video id="lobby-video" class="w-full rounded-xl aspect-video object-cover" controls playsinline src=""></video>
                </div>
                <div class="flex gap-2 pb-20">
                    <input type="text" id="chat-input" placeholder="Escribe..." class="flex-1 bg-black border border-zinc-800 p-4 rounded-xl text-white outline-none">
                    <button onclick="sendChatMessage()" class="btn-gold px-6 rounded-xl font-bold">ENVIAR</button>
                </div>
            </div>

            <!-- JUEGO -->
            <div id="view-game" class="hidden min-h-full p-4">
                <div class="max-w-3xl mx-auto pt-10">
                    <div class="flex justify-between items-center mb-6">
                        <div id="game-lives" class="flex text-yellow-500"></div>
                        <div id="game-score" class="text-4xl font-royal text-yellow-500">0</div>
                    </div>
                    <div class="timer-container mb-8"><div id="timer-bar"></div></div>
                    <div id="q-card" class="card-glass p-8 rounded-[2.5rem] border-t-4 border-yellow-500/50">
                        <p id="q-index" class="text-center text-[10px] text-yellow-600 font-bold mb-4 uppercase"></p>
                        <h3 id="q-text" class="text-xl md:text-2xl text-center font-semibold mb-8"></h3>
                        <div id="options-grid" class="grid grid-cols-1 gap-3"></div>
                    </div>
                </div>
            </div>

            <!-- PANEL ADMIN (SALA Y SUPREMO) -->
            <div id="view-admin" class="hidden min-h-screen p-4 overflow-y-auto">
                <div class="max-w-7xl mx-auto pb-20">
                    <div class="flex justify-between items-center mb-10">
                        <h2 id="admin-title" class="font-royal text-3xl text-yellow-500">Comando de Sala</h2>
                        <button onclick="showView('levels')" class="bg-zinc-800 px-4 py-2 rounded text-xs">Cerrar</button>
                    </div>

                    <!-- SELECTOR DE SALA (SOLO SUPREMO) -->
                    <div id="super-room-selector" class="hidden mb-8 card-glass p-4 rounded-2xl border-2 border-red-900/30">
                        <label class="block text-[10px] text-zinc-500 uppercase mb-2">Supervisar Sala:</label>
                        <select id="super-room-select" onchange="changeSupervisedRoom(this.value)" class="w-full bg-black border border-zinc-700 p-3 rounded text-white font-bold">
                            <option value="1">SALA 1</option><option value="2">SALA 2</option><option value="3">SALA 3</option>
                            <option value="4">SALA 4</option><option value="5">SALA 5</option>
                        </select>
                    </div>

                    <!-- CARGA DE EXCEL (SOLO SUPREMO) -->
                    <div id="super-excel-tools" class="hidden mb-8 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="card-glass p-6 rounded-3xl border-2 border-red-900/30">
                            <h3 class="text-xs font-bold text-red-500 uppercase mb-4">Cargar Niveles Globales</h3>
                            <div class="flex gap-2">
                                <select id="excel-lvl-target" class="bg-black border border-zinc-800 p-2 text-xs rounded">
                                    <option value="1">Nivel 1</option><option value="2">Nivel 2</option><option value="3">Nivel 3</option>
                                    <option value="4">Nivel 4</option><option value="5">Nivel 5</option><option value="6">Nivel 6</option>
                                    <option value="7">Nivel 7</option><option value="8">Nivel 8</option><option value="9">Nivel 9</option>
                                    <option value="10">Nivel 10</option><option value="11">Nivel 11</option><option value="12">Nivel 12</option>
                                </select>
                                <button onclick="triggerExcel('levels')" class="btn-gold flex-1 py-2 text-[10px]">Subir Preguntas</button>
                            </div>
                        </div>
                        <div class="card-glass p-6 rounded-3xl border-2 border-red-900/30">
                            <h3 class="text-xs font-bold text-red-500 uppercase mb-4">Contenido Flotante y Botones</h3>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="triggerExcel('f_q')" class="bg-zinc-800 px-3 py-2 rounded text-[8px] uppercase">Excel ?</button>
                                <button onclick="triggerExcel('f_b')" class="bg-zinc-800 px-3 py-2 rounded text-[8px] uppercase">Excel Libro</button>
                                <button onclick="triggerExcel('f_h')" class="bg-zinc-800 px-3 py-2 rounded text-[8px] uppercase">Excel Corazón</button>
                                <button onclick="toggleFloatingGlobal()" id="btn-toggle-float" class="bg-red-900/40 text-red-500 border border-red-900 px-3 py-2 rounded text-[8px] uppercase font-bold">Botones OFF</button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="card-glass p-6 rounded-3xl">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                <div class="bg-black/40 p-4 rounded-xl">
                                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">PIN de Acceso Sala</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="adm-room-pin" maxlength="4" class="w-full bg-black border border-zinc-800 p-2 rounded text-white text-center font-bold">
                                        <button onclick="updateRoomPin()" class="bg-zinc-800 px-3 rounded text-[9px] uppercase">OK</button>
                                    </div>
                                </div>
                                <div class="bg-black/40 p-4 rounded-xl">
                                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Vidas y Tiempo</label>
                                    <div class="flex gap-2">
                                        <select id="adm-lives" onchange="updateRoomSettings()" class="flex-1 bg-black text-[10px] p-1 rounded"><option value="1">1 V</option><option value="3" selected>3 V</option><option value="6">6 V</option></select>
                                        <select id="adm-timer" onchange="updateRoomSettings()" class="flex-1 bg-black text-[10px] p-1 rounded"><option value="15">15s</option><option value="30" selected>30s</option><option value="50">50s</option></select>
                                    </div>
                                </div>
                            </div>
                            <div id="adm-levels-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
                            <div class="mt-8">
                                <button onclick="toggleRanking()" id="btn-rank-toggle" class="w-full py-4 rounded-xl font-bold uppercase text-[10px] border"></button>
                            </div>
                        </div>
                        <div class="card-glass p-6 rounded-3xl">
                            <h3 class="text-center font-royal text-yellow-500 mb-4">Monitor de Guerreros</h3>
                            <div id="adm-monitor" class="space-y-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RESULTADOS -->
            <div id="view-results" class="results-overlay hidden">
                <h2 class="font-royal text-4xl text-yellow-500 mb-8 mt-10">Hall de la Gloria</h2>
                <div id="results-list" class="w-full max-w-2xl space-y-3 px-4 pb-20"></div>
                <button onclick="showView('levels')" class="fixed bottom-10 btn-gold px-12 py-3 rounded-full text-xs">Regresar</button>
            </div>

        </div>
        <input type="file" id="excel-input" accept=".xlsx" class="hidden">
        <footer class="footer-anclado">DESARROLLADO POR - ROBERT PARACO 2026</footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, getDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const IMAGEN_GANASTE = "https://raw.githubusercontent.com/robertproductions12-developer/BATALLADANIEL/refs/heads/main/sii.png";
        const IMAGEN_PERDISTE ="https://raw.githubusercontent.com/robertproductions12-developer/BATALLADANIEL/refs/heads/main/sii.png";
        
        let uState = { name: '', isAdmin: false, isSuper: false, roomId: '', lives: 3, score: 0, qIndex: 0 };
        let rConfig = { levels: {}, showRanking: false, lives: 3, timer: 30, pin: '', adminName: '' };
        let gConfig = { showFloating: true };
        let floatingData = { question: [], book: [], heart: [] };
        let activeLvl = 0;
        let currentQuestions = [];
        let timerInt = null;
        let excelMode = '';

        const gameMusic = document.getElementById('game-music');
        const lionRoar = document.getElementById('lion-roar');
        const successSound = document.getElementById('success-sound');

        // --- INICIO ---
        window.endIntro = () => {
            document.getElementById('intro-overlay').classList.add('fade-out');
            document.getElementById('main-content').classList.replace('opacity-0', 'opacity-100');
            document.getElementById('bg-video-loop').play().catch(()=>{});
            gameMusic.play().catch(()=>{});
            initSalasStatus();
        };

        async function initSalasStatus() {
            for(let i=1; i<=5; i++) {
                const ref = doc(db, "salas_status", "sala_"+i);
                const snap = await getDoc(ref);
                if(!snap.exists()) await setDoc(ref, { id: i, admin: '', status: 'libre' });
            }
        }

        // --- NAVEGACIÓN ---
        window.showView = (id) => {
            if(timerInt) clearInterval(timerInt);
            const views = ['login', 'rooms', 'levels', 'lobby', 'game', 'admin', 'results'];
            views.forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
            document.getElementById('view-'+id).classList.remove('hidden');
        };

        // --- LOGIN Y SALAS ---
        window.toggleSuperAdminField = () => document.getElementById('super-pass-container').classList.toggle('hidden');

        window.handleSuperAuth = async () => {
            if(document.getElementById('super-pass').value === "Daniel777") {
                uState.isSuper = true; uState.isAdmin = true; uState.name = "SUPREMO";
                document.getElementById('super-admin-tools').classList.remove('hidden');
                document.getElementById('super-room-selector').classList.remove('hidden');
                document.getElementById('admin-title').innerText = "MANDO SUPREMO";
                changeSupervisedRoom("1");
            } else Swal.fire("Error", "Clave incorrecta", "error");
        };

        window.joinWithCode = async () => {
            const name = document.getElementById('login-name').value.trim();
            const pin = document.getElementById('login-room-code').value.trim();
            if(!name || !pin) return Swal.fire("Error", "Faltan datos", "warning");

            for(let i=1; i<=5; i++) {
                const snap = await getDoc(doc(db, "salas_config", "sala_"+i));
                if(snap.exists() && snap.data().pin === pin) {
                    uState.name = name; uState.roomId = i; uState.isAdmin = (snap.data().adminName === name);
                    enterRoom(i); return;
                }
            }
            Swal.fire("Error", "Código de sala no encontrado", "error");
        };

        onSnapshot(collection(db, "salas_status"), (snap) => {
            const grid = document.getElementById('rooms-grid'); grid.innerHTML = "";
            snap.docs.sort((a,b)=>a.data().id - b.data().id).forEach(d => {
                const s = d.data();
                const busy = s.status === 'ocupado';
                grid.innerHTML += `
                    <div class="card-glass p-6 rounded-3xl border-l-4 ${busy ? 'border-red-600':'border-green-600'}">
                        <h4 class="font-royal text-yellow-500 mb-2">SALA ${s.id}</h4>
                        <p class="text-[9px] text-zinc-500 uppercase mb-4">Admin: ${s.admin || 'Vacante'}</p>
                        <button onclick="takeControl(${s.id})" class="btn-gold w-full py-2 rounded-xl text-[10px]">
                            ${busy ? 'ADMINISTRAR' : 'CREAR BATALLA'}
                        </button>
                    </div>`;
            });
        });

        window.takeControl = async (id) => {
            const name = document.getElementById('login-name').value.trim();
            if(!name) return Swal.fire("Error", "Ingresa tu nombre primero", "warning");

            const refStatus = doc(db, "salas_status", "sala_"+id);
            const snapStatus = await getDoc(refStatus);
            
            if(snapStatus.data().status === 'libre') {
                await updateDoc(refStatus, { admin: name, status: 'ocupado' });
                await setDoc(doc(db, "salas_config", "sala_"+id), { adminName: name, pin: '1234', lives: 3, timer: 30, showRanking: false, levels: {} });
                uState.isAdmin = true;
            } else {
                if(snapStatus.data().admin !== name) return Swal.fire("Acceso Denegado", "Esta sala ya tiene un administrador", "error");
                uState.isAdmin = true;
            }
            uState.name = name; uState.roomId = id;
            enterRoom(id);
        };

        function enterRoom(id) {
            uState.roomId = id;
            document.getElementById('info-current-room').innerText = "SALA " + id + " | " + uState.name;
            if(uState.isAdmin) document.getElementById('btn-admin-panel').classList.remove('hidden');
            window.showView('levels');
            syncData();
        }

        // --- SYNC ---
        function syncData() {
            // Config de Sala
            onSnapshot(doc(db, "salas_config", "sala_"+uState.roomId), (snap) => {
                if(!snap.exists()) return;
                rConfig = snap.data();
                renderLevelGrid();
                if(uState.isAdmin) refreshAdminUI();
                if(rConfig.showRanking && !uState.isAdmin) {
                    showView('results'); loadRanking();
                } else {
                    document.getElementById('view-results').classList.add('hidden');
                }
            });

            // Config Global (Supremo)
            onSnapshot(doc(db, "config", "global"), (snap) => {
                if(snap.exists()) {
                    gConfig = snap.data();
                    const group = document.getElementById('floating-btns-group');
                    gConfig.showFloating ? group.classList.remove('hidden') : group.classList.add('hidden');
                    if(uState.isSuper) document.getElementById('btn-toggle-float').innerText = gConfig.showFloating ? "Botones ON" : "Botones OFF";
                }
            });

            // Frases Flotantes
            onSnapshot(doc(db, "config", "floating"), (snap) => {
                if(snap.exists()) floatingData = snap.data();
            });

            // Chat
            onSnapshot(collection(db, "salas_config", "sala_"+uState.roomId, "chat"), (snap) => {
                const box = document.getElementById('chat-messages'); box.innerHTML = "";
                snap.docs.reverse().forEach(d => {
                    const m = d.data();
                    box.innerHTML += `<div class="mb-2 p-2 bg-white/5 rounded border-l-2 border-yellow-600"><b class="text-yellow-600 uppercase">${m.user}:</b> ${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });

            // Monitor
            onSnapshot(collection(db, "salas_config", "sala_"+uState.roomId, "players"), (snap) => {
                const players = snap.docs.map(d => d.data());
                if(uState.isAdmin) updateMonitor(players);
            });
        }

        // --- UI ADMIN ---
        function refreshAdminUI() {
            document.getElementById('adm-room-pin').value = rConfig.pin;
            document.getElementById('adm-lives').value = rConfig.lives;
            document.getElementById('adm-timer').value = rConfig.timer;
            
            const btnRank = document.getElementById('btn-rank-toggle');
            btnRank.innerText = rConfig.showRanking ? "OCULTAR RANKING A JUGADORES" : "MOSTRAR RANKING A JUGADORES";
            btnRank.className = rConfig.showRanking ? "w-full py-4 rounded-xl font-bold uppercase text-[10px] bg-red-900/20 text-red-500 border-red-900" : "w-full py-4 rounded-xl font-bold uppercase text-[10px] bg-green-900/20 text-green-500 border-green-900";

            const lGrid = document.getElementById('adm-levels-grid'); lGrid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const act = rConfig.levels?.[i]?.active;
                lGrid.innerHTML += `
                    <div class="p-2 bg-black/40 rounded border border-white/5 flex flex-col gap-2">
                        <span class="text-[8px] uppercase font-bold text-center">Cap ${i}</span>
                        <button onclick="toggleLvl(${i})" class="py-1 rounded text-[7px] font-bold ${act?'bg-red-900 text-white':'bg-green-900 text-white'} uppercase">${act?'OFF':'ON'}</button>
                        ${act ? `<span class="text-[8px] text-yellow-500 font-bold text-center">${rConfig.levels[i].pin}</span>`:''}
                    </div>`;
            }
        }

        window.updateRoomPin = () => updateDoc(doc(db, "salas_config", "sala_"+uState.roomId), { pin: document.getElementById('adm-room-pin').value });
        window.updateRoomSettings = () => updateDoc(doc(db, "salas_config", "sala_"+uState.roomId), { lives: parseInt(document.getElementById('adm-lives').value), timer: parseInt(document.getElementById('adm-timer').value) });
        window.toggleRanking = () => updateDoc(doc(db, "salas_config", "sala_"+uState.roomId), { showRanking: !rConfig.showRanking });
        window.toggleLvl = (n) => {
            const lvls = {...rConfig.levels};
            const current = lvls[n] || { active: false, pin: '' };
            current.active = !current.active;
            current.pin = current.active ? Math.floor(1000 + Math.random()*9000).toString() : '';
            lvls[n] = current;
            updateDoc(doc(db, "salas_config", "sala_"+uState.roomId), { levels: lvls });
        };

        // --- SUPREMO ---
        window.changeSupervisedRoom = (id) => { uState.roomId = id; syncData(); };
        window.toggleFloatingGlobal = () => updateDoc(doc(db, "config", "global"), { showFloating: !gConfig.showFloating });
        
        window.triggerExcel = (mode) => { excelMode = mode; document.getElementById('excel-input').click(); };
        document.getElementById('excel-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const book = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                const data = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                if(excelMode === 'levels') {
                    const l = document.getElementById('excel-lvl-target').value;
                    await setDoc(doc(db, "global_questions", "lvl_"+l), { data });
                } else {
                    const keys = { f_q: 'question', f_b: 'book', f_h: 'heart' };
                    const update = {}; update[keys[excelMode]] = data;
                    await updateDoc(doc(db, "config", "floating"), update);
                }
                Swal.fire("Éxito", "Datos cargados", "success");
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        // --- JUEGO ---
        function renderLevelGrid() {
            const g = document.getElementById('level-grid'); g.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const act = rConfig.levels?.[i]?.active;
                g.innerHTML += `<div class="level-card ${act?'active':''}" onclick="openLobby(${i})"><img src="${i}.jpg" class="w-full h-full object-cover"></div>`;
            }
        }

        window.openLobby = (n) => {
            activeLvl = n;
            document.getElementById('lobby-title').innerText = "CAPÍTULO " + n;
            document.getElementById('lobby-video').src = n + ".mp4";
            const pinArea = document.getElementById('lobby-pin-prompt');
            rConfig.levels?.[n]?.active ? pinArea.classList.remove('hidden') : pinArea.classList.add('hidden');
            showView('lobby');
        };

        window.validateLobbyPin = async () => {
            if(document.getElementById('lobby-pin-input').value === rConfig.levels[activeLvl].pin) {
                const snap = await getDoc(doc(db, "global_questions", "lvl_"+activeLvl));
                if(snap.exists()) {
                    currentQuestions = snap.data().data.sort(()=>Math.random()-0.5).slice(0, 20);
                    startBattle();
                } else Swal.fire("Error", "No hay preguntas en este nivel", "error");
            } else Swal.fire("Denegado", "PIN Incorrecto", "error");
        };

        function startBattle() {
            uState.lives = rConfig.lives; uState.score = 0; uState.qIndex = 0;
            showView('game'); runQuiz();
        }

        function runQuiz() {
            if(timerInt) clearInterval(timerInt);
            if(uState.qIndex >= currentQuestions.length || uState.lives <= 0) return finishGame();
            
            const q = currentQuestions[uState.qIndex];
            document.getElementById('q-index').innerText = `Desafío ${uState.qIndex+1} / 20`;
            document.getElementById('q-text').innerText = q.Pregunta || q.pregunta;
            document.getElementById('game-lives').innerHTML = `<i class="fa-solid fa-heart mr-1"></i>`.repeat(uState.lives);
            document.getElementById('game-score').innerText = uState.score;

            const grid = document.getElementById('options-grid'); grid.innerHTML = "";
            const opts = [q.Correcta || q.correcta, q.Inc1 || q.inc1, q.Inc2 || q.inc2, q.Inc3 || q.inc3].filter(o=>o).sort(()=>Math.random()-0.5);
            opts.forEach(o => {
                const b = document.createElement('button');
                b.className = "btn-option p-4 rounded-xl text-xs font-bold uppercase border border-white/10";
                b.innerText = o;
                b.onclick = () => handleAns(o === (q.Correcta || q.correcta));
                grid.appendChild(b);
            });
            startTimer();
        }

        function startTimer() {
            let rem = rConfig.timer;
            const bar = document.getElementById('timer-bar');
            timerInt = setInterval(() => {
                rem -= 0.1;
                bar.style.width = (rem / rConfig.timer * 100) + "%";
                if(rem <= 0) { clearInterval(timerInt); handleAns(false); }
            }, 100);
        }

        function handleAns(correct) {
            clearInterval(timerInt);
            if(correct) { uState.score += 100; successSound.play(); } 
            else { uState.lives--; lionRoar.play(); }
            uState.qIndex++;
            updateStats();
            setTimeout(runQuiz, 600);
        }

        async function updateStats() {
            await setDoc(doc(db, "salas_config", "sala_"+uState.roomId, "players", uState.name), {
                name: uState.name, score: uState.score, qIndex: uState.qIndex, lives: uState.lives, dead: uState.lives <= 0
            });
        }

        function finishGame() {
            const win = uState.lives > 0;
            const screen = document.getElementById('final-image-screen');
            document.getElementById('final-image-content').src = win ? IMAGEN_GANASTE : IMAGEN_PERDISTE;
            screen.classList.remove('hidden');
        }
        window.closeOutcomeVideo = () => {
            document.getElementById('final-image-screen').classList.add('hidden');
            showView('levels');
        };

        // --- MONITOR & RANKING ---
        function updateMonitor(players) {
            const m = document.getElementById('adm-monitor'); m.innerHTML = "";
            players.sort((a,b)=>b.score - a.score).forEach(p => {
                m.innerHTML += `<div class="p-3 bg-black/40 rounded flex justify-between items-center border border-white/5 text-[10px]">
                    <span class="${p.dead?'text-red-500':'text-yellow-500'} font-bold uppercase">${p.name}</span>
                    <span class="text-zinc-400">Puntaje: ${p.score} | Desafío: ${p.qIndex}/20</span>
                </div>`;
            });
        }

        async function loadRanking() {
            const snap = await getDocs(collection(db, "salas_config", "sala_"+uState.roomId, "players"));
            const list = document.getElementById('results-list'); list.innerHTML = "";
            const players = snap.docs.map(d=>d.data()).sort((a,b)=>b.score - a.score);
            players.forEach((p, i) => {
                list.innerHTML += `
                    <div class="card-glass p-4 rounded-2xl flex justify-between items-center border-l-4 ${i<3?'border-yellow-500':'border-zinc-700'}">
                        <span class="font-royal text-yellow-500 text-xl">#${i+1}</span>
                        <span class="font-bold uppercase">${p.name}</span>
                        <span class="font-royal text-yellow-500">${p.score}</span>
                    </div>`;
            });
        }

        // --- EXTRAS ---
        window.sendChatMessage = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "salas_config", "sala_"+uState.roomId, "chat"), { user: uState.name, text: i.value, time: Date.now() });
            i.value = "";
        };

        window.openFloatingCard = (type) => {
            const items = floatingData[type] || [];
            if(items.length === 0) return;
            const r = items[Math.floor(Math.random()*items.length)];
            document.getElementById('f-card-icon').innerHTML = `<i class="fa-solid fa-${type==='question'?'question':type==='book'?'book-open':'heart'}"></i>`;
            document.getElementById('f-card-text').innerText = r.Frase || r.Texto;
            document.getElementById('f-card-sub').innerText = r.Referencia || r.Cita;
            document.getElementById('floating-card-overlay').classList.remove('hidden');
        };

        window.resetGlobalSystem = async () => {
            if(confirm("¿REINICIAR SALA?")) {
                const ps = await getDocs(collection(db, "salas_config", "sala_"+uState.roomId, "players"));
                ps.forEach(async d => await deleteDoc(d.ref));
                await updateDoc(doc(db, "salas_config", "sala_"+uState.roomId), { levels: {}, showRanking: false });
                Swal.fire("SALA REINICIADA", "", "success");
            }
        };

        window.deleteFullChat = async () => {
            const cs = await getDocs(collection(db, "salas_config", "sala_"+uState.roomId, "chat"));
            cs.forEach(async d => await deleteDoc(d.ref));
        };

    </script>
</body>
</html>
