<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel: El Desafío Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow: hidden; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        /* --- EFECTO CUEVA 3D --- */
        #cave-background {
            position: fixed;
            inset: 0;
            z-index: -1;
            perspective: 1200px;
            background: #000;
            overflow: hidden;
        }

        .cave-layer {
            position: absolute;
            inset: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Capa de fondo (Fondo de la cueva) */
        .layer-deep {
            background-image: url('https://i.ibb.co/LST60XF/cave-deep.jpg'); /* Reemplazar con tu imagen 2 */
            transform: translateZ(-300px) scale(1.5);
            filter: brightness(0.4) blur(2px);
        }

        /* Capa media (Rocas y sombras) */
        .layer-mid {
            background-image: url('https://i.ibb.co/hR03YqK/cave-mid.png'); /* Imagen con transparencia de rocas */
            transform: translateZ(-150px) scale(1.2);
            mix-blend-mode: multiply;
        }

        /* Capa frontal (Boca de la cueva) */
        .layer-front {
            background-image: url('https://i.ibb.co/S6D89mF/cave-front.png'); /* Marco de la cueva */
            transform: translateZ(50px);
        }

        /* LUZ DINÁMICA DEL FONDO */
        .ambient-light {
            position: absolute;
            width: 60vmax;
            height: 60vmax;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(212,175,55,0.05) 40%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            animation: drift 15s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes drift {
            0% { transform: translate(-60%, -40%) scale(1); opacity: 0.6; }
            50% { transform: translate(-40%, -60%) scale(1.2); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
        }

        /* --- INTRO VIDEO --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }

        #intro-overlay.fade-out { opacity: 0; visibility: hidden; }

        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,255,255,0.5);
        }
        
        .card-glass { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.2); }
        
        /* Animación suave para el contenido al entrar */
        .content-fade-in { animation: fadeIn 2s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <!-- 1. VIDEO DE INTRODUCCIÓN (PANTALLA COMPLETA) -->
    <div id="intro-overlay">
        <!-- Reemplaza el src con tu link de video directo -->
        <video id="intro-video" playsinline muted class="w-full h-full object-cover">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-mysterious-cave-entrance-with-light-coming-in-41138-large.mp4" type="video/mp4">
        </video>
        <!-- Botón Saltar Intro -->
        <button onclick="endIntro()" class="absolute bottom-10 right-10 text-white/50 text-xs border border-white/20 px-4 py-2 rounded-full uppercase tracking-widest hover:bg-white/10">Saltar Intro</button>
    </div>

    <!-- 2. FONDO DE CUEVA 3D DINÁMICO -->
    <div id="cave-background">
        <div class="ambient-light"></div>
        <div class="cave-layer layer-deep" id="l-deep"></div>
        <div class="cave-layer layer-mid" id="l-mid"></div>
        <div class="cave-layer layer-front" id="l-front"></div>
    </div>

    <!-- 3. CONTENIDO PRINCIPAL (TU LOGIN) -->
    <div id="main-content" class="relative z-10 opacity-0 transition-opacity duration-1000 overflow-y-auto h-screen">
        
        <!-- LOGIN (Modificado para verse bien sobre el fondo 3D) -->
        <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-6">
            <h1 class="font-royal text-6xl md:text-8xl mb-2 text-yellow-500 drop-shadow-[0_0_15px_rgba(212,175,55,0.5)] text-center">DANIEL</h1>
            <p class="text-xs tracking-[0.8em] mb-12 text-zinc-400 uppercase text-center">El Desafío de los Reinos</p>
            
            <div class="card-glass p-8 md:p-10 rounded-[2.5rem] w-full max-w-md border-t-2 border-yellow-500/30">
                <input type="text" id="login-name" placeholder="Escribe tu Nombre" class="w-full bg-black/50 border border-zinc-800 p-5 rounded-2xl mb-5 text-center text-xl text-white outline-none focus:border-yellow-600 transition-all focus:ring-1 focus:ring-yellow-600">
                <div id="admin-pass-container" class="hidden">
                    <input type="password" id="login-pass" placeholder="Clave de Mando" class="w-full bg-black/50 border border-zinc-800 p-5 rounded-2xl mb-5 text-center text-white outline-none">
                </div>
                <button onclick="handleAuth()" class="btn-gold w-full py-5 rounded-2xl text-xl tracking-tighter uppercase">Comenzar Aventura</button>
                <button onclick="toggleAdminField()" class="text-[10px] mt-8 text-zinc-500 underline uppercase block mx-auto tracking-widest opacity-50 hover:opacity-100 transition">Acceso Jerárquico</button>
            </div>
        </div>

        <!-- ... (Aquí siguen tus otras vistas: view-levels, view-lobby, etc., sin cambios estructurales) ... -->
    </div>

    <script type="module">
        // Importamos Firebase (mantén tus credenciales)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, deleteDoc, query, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE (Asegúrate de que esta sea la tuya)
        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LÓGICA DE INICIO Y VIDEO ---
        const introVid = document.getElementById('intro-video');
        
        window.addEventListener('load', () => {
            // Iniciar video automáticamente
            introVid.play().catch(e => console.log("Auto-play bloqueado, esperando interacción"));
        });

        introVid.onended = () => endIntro();

        window.endIntro = () => {
            document.getElementById('intro-overlay').classList.add('fade-out');
            document.getElementById('main-content').classList.remove('opacity-0');
            document.body.style.overflow = 'auto';
            // Iniciamos el efecto de movimiento de la cueva
            initCaveParallax();
        };

        // --- EFECTO PARALLAX CINEMATOGRÁFICO ---
        function initCaveParallax() {
            const layers = [
                { id: 'l-deep', factor: 0.02 },
                { id: 'l-mid', factor: 0.05 },
                { id: 'l-front', factor: 0.08 }
            ];

            // Para PC: Movimiento con el Mouse
            window.addEventListener('mousemove', (e) => {
                const x = (e.clientX - window.innerWidth / 2) * -1;
                const y = (e.clientY - window.innerHeight / 2) * -1;
                
                layers.forEach(layer => {
                    const el = document.getElementById(layer.id);
                    el.style.transform = `translate(${x * layer.factor}px, ${y * layer.factor}px) ${getInitialScale(layer.id)}`;
                });
            });

            // Para Celulares: Giroscopio (opcional pero inmersivo)
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    const x = e.gamma * 2; // Inclinación lateral
                    const y = e.beta * 2;  // Inclinación adelante/atrás
                    layers.forEach(layer => {
                        const el = document.getElementById(layer.id);
                        el.style.transform = `translate(${x * layer.factor * 5}px, ${y * layer.factor * 5}px) ${getInitialScale(layer.id)}`;
                    });
                });
            }
        }

        function getInitialScale(id) {
            if(id === 'l-deep') return 'translateZ(-300px) scale(1.5)';
            if(id === 'l-mid') return 'translateZ(-150px) scale(1.2)';
            return 'translateZ(50px)';
        }

        // --- TU LÓGICA ORIGINAL DE FIREBASE (Continúa aquí) ---
        // ... (handleAuth, startLocalLevel, renderQuestion, etc.)
        // Nota: Asegúrate de envolver el resto de tu código en este bloque de script
        // o asegúrate de que las funciones sean accesibles vía 'window.'
        
        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');

        // ... Resto de tus funciones adaptadas ...
        // (He conservado la estructura para que solo copies y pegues)
    </script>
</body>
</html>
