
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel: El Desafío Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        /* --- FONDO DE VIDEO EN LOOP (REEMPLAZA LAS CAPAS 3D) --- */
        #video-bg-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #video-bg-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4); /* Oscurece un poco para que se lea el texto */
        }

        /* --- INTRO VIDEO --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease, visibility 1.5s;
        }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; }

        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,255,255,0.5);
            text-transform: uppercase;
        }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(191, 149, 63, 0.4); }
        
        .card-glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.1); }
        
        .level-card { 
            position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 1.5rem;
            cursor: pointer; transition: all 0.4s ease; border: 2px solid rgba(212, 175, 55, 0.2);
        }
        .level-card:hover { border-color: var(--gold); transform: scale(1.02); }
        .level-card img { width: 100%; height: 100%; object-fit: cover; }
        .level-overlay-num { 
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 4rem; font-family: 'Cinzel'; color: rgba(255,255,255,0.2); font-weight: 900;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. VIDEO DE INTRODUCCIÓN (SOLO AL INICIO) -->
    <div id="intro-overlay">
        <video id="intro-video" playsinline muted class="w-full h-full object-cover">
            <!-- URL DE TU VIDEO DE INTRODUCCIÓN -->
            <source src="https://assets.mixkit.co/videos/preview/mixkit-mysterious-cave-entrance-with-light-coming-in-41138-large.mp4" type="video/mp4">
        </video>
        <button onclick="endIntro()" class="absolute bottom-10 right-10 text-white/50 text-xs border border-white/20 px-6 py-3 rounded-full uppercase tracking-widest hover:bg-white/10">Saltar Intro</button>
    </div>

    <!-- 2. FONDO DE VIDEO CONSTANTE (LOOP) -->
    <div id="video-bg-container">
        <video autoplay muted loop playsinline>
            <!-- REEMPLAZA CON EL LINK DE TU VIDEO DE CUEVA (LOOP) -->
            <source src="https://assets.mixkit.co/videos/preview/mixkit-fire-burning-in-a-dark-cave-43034-large.mp4" type="video/mp4">
        </video>
    </div>

    <!-- 3. CONTENIDO DEL JUEGO -->
    <div id="main-content" class="relative z-10 opacity-0 transition-opacity duration-1000">
        
        <!-- VISTA: LOGIN -->
        <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-6">
            <h1 class="font-royal text-6xl md:text-8xl mb-2 text-yellow-500 text-center drop-shadow-2xl">DANIEL</h1>
            <p class="text-[10px] tracking-[0.8em] mb-12 text-zinc-400 uppercase text-center">El Desafío de los Reinos</p>
            
            <div class="card-glass p-10 rounded-[2.5rem] w-full max-w-md">
                <input type="text" id="login-name" placeholder="Tu Nombre" class="w-full bg-black/50 border border-zinc-800 p-5 rounded-2xl mb-5 text-center text-xl text-white outline-none focus:border-yellow-600 transition-colors">
                <div id="admin-pass-container" class="hidden">
                    <input type="password" id="login-pass" placeholder="Clave de Mando" class="w-full bg-black/50 border border-zinc-800 p-5 rounded-2xl mb-5 text-center text-white outline-none">
                </div>
                <button onclick="handleAuth()" class="btn-gold w-full py-5 rounded-2xl text-xl font-bold">Entrar</button>
                <button onclick="toggleAdminField()" class="text-[10px] mt-8 text-zinc-600 underline uppercase block mx-auto tracking-widest">Acceso Jerárquico</button>
            </div>
        </div>

        <!-- VISTA: MAPA DE 12 NIVELES -->
        <div id="view-levels" class="hidden min-h-screen p-8 md:p-16">
            <header class="flex justify-between items-center mb-12 max-w-7xl mx-auto">
                <div>
                    <p id="player-welcome" class="text-yellow-600 text-[10px] tracking-widest uppercase font-bold"></p>
                    <h2 class="font-royal text-4xl text-white">MISIONES</h2>
                </div>
                <button onclick="location.reload()" class="bg-zinc-900/50 text-zinc-400 px-6 py-2 rounded-xl text-xs font-bold border border-zinc-800">SALIR</button>
            </header>
            
            <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
                <!-- Se genera por JavaScript -->
            </div>
        </div>

        <!-- VISTA: LOBBY DE ESPERA -->
        <div id="view-lobby" class="hidden min-h-screen flex flex-col p-6 max-w-3xl mx-auto">
            <header class="flex justify-between items-center mb-8">
                <button onclick="showView('levels')" class="bg-zinc-900 p-3 rounded-full text-yellow-600">←</button>
                <h2 id="lobby-title" class="font-royal text-2xl text-yellow-500 uppercase">Lobby</h2>
                <div class="w-10"></div>
            </header>
            <div class="flex-1 card-glass rounded-3xl p-6 mb-6 overflow-y-auto" id="chat-messages"></div>
            <div class="text-center p-10 border-2 border-dashed border-yellow-900/30 rounded-[2.5rem] bg-yellow-900/5">
                <p class="text-yellow-600 font-bold uppercase tracking-widest animate-pulse">Esperando que el Rey de la orden...</p>
            </div>
        </div>

        <!-- VISTA: ADMINISTRADOR -->
        <div id="view-admin" class="hidden min-h-screen p-8 bg-zinc-950/90">
             <div class="max-w-7xl mx-auto text-center">
                <h2 class="font-royal text-4xl text-red-600 mb-12">SALA DE MANDO</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="card-glass p-8 rounded-[2.5rem]">
                        <h3 class="text-yellow-500 mb-6 font-royal">Control de Nivel</h3>
                        <select id="adm-level" class="w-full bg-black p-4 rounded-xl mb-6 border border-zinc-800 text-white">
                            <!-- Opciones 1-12 -->
                        </select>
                        <button onclick="toggleGameState()" class="btn-gold w-full py-4 rounded-xl">Iniciar / Detener</button>
                    </div>
                    <div class="card-glass p-8 rounded-[2.5rem]">
                        <h3 class="text-yellow-500 mb-6 font-royal">Subir Preguntas</h3>
                        <input type="file" id="adm-excel" accept=".xlsx" class="hidden" onchange="processExcel(this)">
                        <button onclick="document.getElementById('adm-excel').click()" class="w-full py-10 border-2 border-dashed border-zinc-700 rounded-3xl text-zinc-500 font-bold">CARGAR EXCEL</button>
                    </div>
                </div>
                <button onclick="location.reload()" class="mt-12 text-zinc-600 underline uppercase text-[10px]">Cerrar Sesión</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, deleteDoc, query, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE (Mantén la tuya)
        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let userState = { name: '', isAdmin: false };

        // --- MANEJO DE INTRO ---
        const introVid = document.getElementById('intro-video');
        window.addEventListener('load', () => { introVid.play().catch(() => {}); });
        introVid.onended = () => endIntro();

        window.endIntro = () => {
            document.getElementById('intro-overlay').classList.add('fade-out');
            document.getElementById('main-content').classList.remove('opacity-0');
        };

        // --- AUTH Y NIVELES ---
        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');

        window.handleAuth = async () => {
            const name = document.getElementById('login-name').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (!name) return;

            if (name.toLowerCase() === 'admin' && pass === "Daniel777") {
                userState.isAdmin = true;
                initAdmin();
                return;
            }

            userState.name = name;
            document.getElementById('player-welcome').innerText = "Soldado: " + name;
            showView('levels');
            renderLevelGrid();
        };

        function renderLevelGrid() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const card = document.createElement('div');
                card.className = "level-card";
                card.innerHTML = `
                    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60" alt="Nivel ${i}">
                    <div class="level-overlay-num">${i}</div>
                    <div class="absolute bottom-4 left-4 font-royal text-white text-sm">Capítulo ${i}</div>
                `;
                card.onclick = () => {
                    document.getElementById('lobby-title').innerText = "Misión " + i;
                    showView('lobby');
                };
                grid.appendChild(card);
            }
        }

        // --- VISTAS ---
        function showView(id) {
            ['view-login', 'view-levels', 'view-lobby', 'view-admin'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById('view-' + id).classList.remove('hidden');
        }
        window.showView = showView;

        // --- ADMIN ---
        function initAdmin() {
            showView('admin');
            const sel = document.getElementById('adm-level');
            for(let i=1; i<=12; i++) sel.innerHTML += `<option value="${i}">Misión ${i}</option>`;
        }

        window.toggleGameState = () => {
            Swal.fire("Acción", "Sincronizando con el servidor...", "info");
        };

        window.processExcel = (input) => {
            Swal.fire("Éxito", "Archivo analizado correctamente", "success");
        };
    </script>
</body>
</html>
