<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daniel: El Desafío Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; height: 100vh; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        #video-bg-container { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: hidden; }
        #video-bg-container video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3); }

        #intro-overlay, .fullscreen-video { position: fixed; inset: 0; z-index: 1000; background: black; display: flex; align-items: center; justify-content: center; transition: opacity 1s, visibility 1s; }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; }
        
        #intro-video { object-fit: cover; width: 100%; height: 100%; }

        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); text-transform: uppercase;
        }
        
        .card-glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.15); }
        
        /* ANIMACIONES */
        @keyframes correct-pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-pop 0.4s ease-out; }

        @keyframes hourglass-spin { 
            0% { transform: rotate(0deg); } 
            20% { transform: rotate(180deg); } 
            100% { transform: rotate(180deg); } 
        }
        .animate-hourglass { animation: hourglass-spin 3s infinite ease-in-out; }

        #flash-overlay { position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        .flash-red { background: rgba(255, 0, 0, 0.4); }
        .flash-green { background: rgba(0, 255, 0, 0.3); }

        /* BARRA DE PROGRESO */
        .timer-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--gold); transition: width 0.1s linear, background-color 0.3s; }

        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, 1px); } }
        .shake-screen { animation: shake 0.3s infinite; }

        .level-card { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 1.2rem; border: 2px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: 0.5s; filter: brightness(0.2) grayscale(1); }
        .level-card.active { filter: brightness(1) grayscale(0); border: 3px solid var(--gold); }

        .gold-heart { color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); font-size: 1.2rem; margin-right: 4px; }
        .hidden { display: none !important; }

        .footer-anclado { position: relative; width: 100%; text-align: center; padding: 15px; background: linear-gradient(to top, #000, transparent); color: var(--gold); font-size: 10px; letter-spacing: 2px; font-weight: bold; }

        .results-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; align-items: center; padding: 1rem; overflow-y: auto; }
        .btn-option { background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.2); transition: 0.2s; color: white; }
        .btn-option:hover { background: rgba(212,175,55,0.1); border-color: var(--gold); }

        /* NUEVA PANTALLA DE IMAGEN FINAL */
        #final-image-screen { position: fixed; inset: 0; z-index: 3000; background-color: black; display: none; }
        #final-image-content { width: 100%; height: 100%; object-fit: contain; } /* "Contain" para asegurar formato vertical en cualquier pantalla */
    </style>
</head>
<body id="game-body">

    <div id="flash-overlay"></div>

    <audio id="game-music" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <audio id="lion-roar" preload="auto"><source src="lion.mp3" type="audio/mpeg"></audio>
    <audio id="success-sound" preload="auto"><source src="correcta.mp3" type="audio/mpeg"></audio>

    <div id="video-bg-container">
        <video id="bg-video-loop" loop playsinline muted><source src="intro.mp4" type="video/mp4"></video>
    </div>

    <!-- PANTALLA DE VIDEO DE RESULTADO -->
    <div id="video-outcome" class="fullscreen-video hidden">
        <video id="outcome-player" playsinline class="w-full h-full object-cover"></video>
    </div>

    <!-- PANTALLA DE IMAGEN FINAL (VERTICAL) -->
    <div id="final-image-screen" class="flex flex-col">
        <img id="final-image-content" src="FINAL.png" alt="Resultado Final">
        <div class="absolute bottom-10 w-full text-center px-4">
            <button onclick="closeOutcomeVideo()" class="btn-gold w-full max-w-xs py-4 rounded-full">Volver a la batalla</button>
        </div>
    </div>

    <div id="intro-overlay">
        <video id="intro-video" playsinline autoplay muted loop><source src="intro2.mp4" type="video/mp4"></video>
        <button onclick="endIntro()" class="absolute bottom-20 btn-gold px-12 py-5 rounded-full text-lg z-[1001]">Entrar a la Batalla</button>
    </div>

    <div id="main-content" class="relative z-10 opacity-0 transition-opacity duration-1000 h-screen flex flex-col">
        <div class="flex-grow overflow-y-auto">
            
            <!-- VISTA LOGIN -->
            <div id="view-login" class="min-h-full flex flex-col items-center justify-center p-6">
                <h1 class="font-royal text-6xl md:text-8xl mb-2 text-yellow-500 text-center drop-shadow-2xl uppercase">Daniel</h1>
                <p class="text-[10px] tracking-[0.6em] mb-12 text-zinc-400 uppercase text-center">El Desafío Profético</p>
                <div class="card-glass p-8 rounded-[2.5rem] w-full max-w-sm">
                    <input type="text" id="login-name" placeholder="Tu Nombre" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-lg text-white outline-none">
                    <div id="admin-pass-container" class="hidden">
                        <input type="password" id="login-pass" placeholder="Clave de Mando" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-white outline-none">
                    </div>
                    <button onclick="handleAuth()" class="btn-gold w-full py-4 rounded-xl text-lg font-bold">Comenzar</button>
                    <button onclick="toggleAdminField()" class="text-[10px] mt-6 text-zinc-600 underline uppercase block mx-auto tracking-widest">Administrador</button>
                </div>
            </div>

            <!-- VISTA NIVELES -->
            <div id="view-levels" class="hidden min-h-screen p-4">
                <header class="flex justify-between items-center mb-6 max-w-7xl mx-auto">
                    <h2 class="font-royal text-2xl text-white uppercase tracking-tighter">Misiones</h2>
                    <button onclick="location.reload()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-lg text-xs font-bold border border-red-900/50">SALIR</button>
                </header>
                <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-7xl mx-auto pb-20"></div>
            </div>

            <!-- VISTA LOBBY -->
            <div id="view-lobby" class="hidden h-[calc(100vh-80px)] flex flex-col p-4 max-w-4xl mx-auto">
                <div class="card-glass p-4 rounded-2xl mb-3 flex flex-col gap-3 shrink-0">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <h2 id="lobby-title" class="font-royal text-xl text-yellow-500 uppercase">LOBBY</h2>
                        <button onclick="showView('levels')" class="text-[10px] text-yellow-600 underline uppercase font-bold px-2 py-1">Regresar</button>
                    </div>
                    <div id="access-code-prompt" class="hidden flex flex-col sm:flex-row gap-2 w-full">
                        <input type="text" id="join-code-input" placeholder="INGRESA EL CÓDIGO" class="flex-1 bg-black border border-yellow-600/50 p-3 rounded-xl text-center text-yellow-500 font-bold outline-none text-base">
                        <button onclick="validateAccessCode()" class="btn-gold py-3 px-4 rounded-xl text-xs sm:text-[10px] whitespace-nowrap">ENTRAR AL QUIZ</button>
                    </div>
                    <button id="admin-back-btn" onclick="showView('admin')" class="hidden w-full bg-zinc-800 py-3 rounded-xl text-[10px] uppercase font-bold text-zinc-300 tracking-widest border border-zinc-700">Panel Admin</button>
                </div>
                <div class="flex-1 card-glass rounded-2xl p-4 mb-3 overflow-y-auto" id="chat-messages" style="min-height: 150px;"></div>
                <div id="lobby-video-container" class="card-glass p-2 rounded-2xl mb-3">
                    <video id="lobby-level-video" class="w-full rounded-xl aspect-video object-cover" controls playsinline><source id="lobby-video-src" src="default.mp4" type="video/mp4"></video>
                </div>
                <div class="flex gap-2 pb-2 shrink-0 w-full items-center">
                    <input type="text" id="chat-input" placeholder="Escribe..." class="flex-1 min-w-0 bg-black border border-zinc-800 p-4 rounded-xl text-white outline-none text-sm">
                    <button onclick="sendChatMessage()" class="btn-gold px-4 py-4 rounded-xl font-bold text-xs flex-shrink-0">ENVIAR</button>
                </div>
            </div>

            <!-- VISTA JUEGO -->
            <div id="view-game" class="hidden min-h-full p-4">
                <div class="max-w-3xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <div id="game-lives" class="flex"></div>
                        <div class="text-right">
                            <span id="game-score" class="text-4xl font-bold text-yellow-500 font-royal">0</span><br>
                            <span id="game-timer-label" class="text-sm font-mono text-zinc-400 tracking-widest">00:00</span>
                        </div>
                    </div>
                    
                    <!-- Barra de tiempo con Reloj -->
                    <div class="flex items-center gap-4 mb-8">
                        <div id="hourglass-container">
                            <i id="hourglass-icon" class="fa-solid fa-hourglass-half text-yellow-500 text-2xl animate-hourglass"></i>
                        </div>
                        <div class="timer-container flex-1"><div id="timer-bar"></div></div>
                    </div>

                    <div id="q-card" class="card-glass p-6 md:p-12 rounded-[2.5rem] flex flex-col min-h-[400px] border-t-4 border-yellow-500/50">
                        <p id="q-index" class="text-center text-[10px] text-yellow-600 font-bold mb-6 tracking-[0.3em] uppercase border-b border-white/10 pb-4"></p>
                        <h3 id="q-text" class="text-xl md:text-3xl text-center font-semibold mb-8 leading-tight"></h3>
                        <div id="options-grid" class="grid grid-cols-1 gap-3"></div>
                        <p id="q-cita" class="mt-8 text-center italic text-sm text-yellow-500/80 font-semibold hidden"></p>
                    </div>
                </div>
            </div>

            <!-- RESULTADOS FINALES (HALL DE LA GLORIA) -->
            <div id="global-results" class="results-overlay hidden">
                <h2 class="font-royal text-3xl md:text-6xl text-yellow-500 mb-6 mt-6 tracking-widest text-center uppercase">Hall de la Gloria</h2>
                <div id="results-list" class="w-full max-w-3xl space-y-3 px-2 pb-20"></div>
                <div class="fixed bottom-10 w-full max-w-xs px-4">
                    <button onclick="location.reload()" class="btn-gold w-full py-4 rounded-full text-sm">Salir del Desafío</button>
                </div>
            </div>

            <!-- PANEL ADMIN -->
            <div id="view-admin" class="hidden min-h-screen p-4 overflow-y-auto">
                <div class="max-w-7xl mx-auto pb-20">
                    <div class="flex flex-wrap justify-between items-center gap-6 mb-10">
                        <button onclick="showView('lobby')" class="bg-blue-900/40 text-blue-400 px-8 py-3 rounded-xl border border-blue-900 font-bold text-[10px] uppercase">Chat</button>
                        <h2 class="font-royal text-3xl text-red-600 text-center">Mando Supremo</h2>
                        <div class="flex gap-2">
                             <!-- NUEVO BOTÓN ELIMINAR CHAT -->
                            <button onclick="deleteFullChat()" class="bg-orange-900/60 text-orange-200 px-4 py-3 rounded-xl border border-orange-700 font-bold text-[10px] uppercase">Borrar Chat Completo</button>
                            <button onclick="resetGlobalSystem()" class="bg-red-900/40 text-red-400 px-8 py-3 rounded-xl border border-red-900 font-bold text-[10px] uppercase">Reiniciar Todo</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="card-glass p-6 rounded-3xl h-fit">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                <div class="bg-black/40 p-4 rounded-xl">
                                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Vidas Globales</label>
                                    <select id="adm-diff" onchange="updateGlobalConfigs()" class="w-full bg-black border border-zinc-700 p-2 rounded text-white text-xs">
                                        <option value="6">6 Vidas</option>
                                        <option value="3" selected>3 Vidas</option>
                                        <option value="1">1 Vida</option>
                                    </select>
                                </div>
                                <div class="bg-black/40 p-4 rounded-xl">
                                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Tiempo por Pregunta</label>
                                    <select id="adm-timer-limit" onchange="updateGlobalConfigs()" class="w-full bg-black border border-zinc-700 p-2 rounded text-white text-xs">
                                        <option value="15">15 Segundos</option>
                                        <option value="30" selected>30 Segundos</option>
                                        <option value="50">50 Segundos</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <div class="bg-black/40 p-4 rounded-xl flex items-center justify-between">
                                    <span class="text-[8px] text-zinc-300 uppercase">Chat Bloq</span>
                                    <input type="checkbox" id="adm-lock-chat" onchange="updateGlobalConfigs()">
                                </div>
                                <div class="bg-black/40 p-4 rounded-xl flex items-center justify-between">
                                    <span class="text-[8px] text-zinc-300 uppercase">Ver Citas</span>
                                    <input type="checkbox" id="adm-show-citas" onchange="updateGlobalConfigs()">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="adm-levels-controls"></div>
                            <div class="mt-10 grid grid-cols-2 gap-4">
                                <button onclick="toggleResults(true)" class="bg-green-600 text-black py-4 rounded-xl font-bold uppercase text-[10px]">Publicar Ranking</button>
                                <button onclick="toggleResults(false)" class="bg-red-700 text-white py-4 rounded-xl font-bold uppercase text-[10px]">Quitar Ranking</button>
                            </div>
                        </div>
                        <div class="card-glass p-6 rounded-3xl h-fit">
                            <h3 class="text-yellow-500 font-royal mb-6 text-center uppercase text-sm">Monitor de Guerreros</h3>
                            <div id="adm-monitor" class="space-y-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <input type="file" id="adm-excel-input" accept=".xlsx" class="hidden">
        <footer class="footer-anclado shrink-0">
            DESARROLLADO POR - ROBERT PARACO 2026 
            <a href="https://www.instagram.com/robert_paraco?igsh=MWx1NXdpZDIxdHdsMg==" target="_blank" class="ml-2 inline-block"><i class="fa-brands fa-instagram text-lg"></i></a>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, query, orderBy, limit, getDoc, deleteDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const DEFAULT_IMAGES = { "1": "1.jpg", "2": "2.jpg", "3": "3.jpg", "4": "4.jpg", "5": "5.jpg", "6": "6.jpg", "7": "7.jpg", "8": "8.jpg", "9": "9.jpg", "10": "10.jpg", "11": "11.jpg", "12": "12.jpg" };
        const LEVEL_VIDEOS = { "1": "dani.mp4", "2": "dani.mp4", "3": "dani.mp4", "4": "dani.mp4", "5": "dani.mp4", "6": "dani.mp4", "7": "dani.mp4", "8": "dani.mp4", "9": "dani.mp4", "10": "dani.mp4", "11": "dani.mp4", "12": "dani.mp4" };

        let userState = { name: '', isAdmin: false, lives: 3, score: 0, qIndex: 0, startTime: 0, totalTime: 0 };
        let gameConfig = { levels: {}, showResults: false, globalLives: 3, chatLocked: false, showCitas: false, timerLimit: 30 };
        let activeLevelLobby = 0;
        let adminLvlTarget = 1;
        let currentLevelQuestions = [];
        let questionInterval = null;

        const gameMusic = document.getElementById('game-music');
        const lionRoar = document.getElementById('lion-roar');
        const successSound = document.getElementById('success-sound');
        const lobbyVideo = document.getElementById('lobby-level-video');
        const outcomePlayer = document.getElementById('outcome-player');

        // --- LÓGICA DE PAUSA DE MÚSICA PARA VIDEOS ---
        lobbyVideo.onplay = () => gameMusic.pause();
        lobbyVideo.onpause = () => gameMusic.play();
        lobbyVideo.onended = () => gameMusic.play();

        window.endIntro = () => {
            document.getElementById('intro-overlay').classList.add('fade-out');
            document.getElementById('main-content').classList.replace('opacity-0', 'opacity-100');
            document.getElementById('bg-video-loop').play().catch(()=>{});
            gameMusic.play().catch(()=>{});
        };

        window.showView = (id) => {
            if(questionInterval) clearInterval(questionInterval);
            ['view-login', 'view-levels', 'view-lobby', 'view-game', 'view-admin'].forEach(v => {
                const el = document.getElementById(v);
                if(el) el.classList.add('hidden');
            });
            const target = document.getElementById('view-' + id);
            if(target) target.classList.remove('hidden');
        };

        function triggerDamageEffect() {
            lionRoar.currentTime = 0; lionRoar.play();
            const body = document.getElementById('game-body');
            const flash = document.getElementById('flash-overlay');
            flash.className = "flash-red";
            body.classList.add('shake-screen'); flash.style.opacity = "1";
            setTimeout(() => { body.classList.remove('shake-screen'); flash.style.opacity = "0"; }, 500);
        }

        function triggerSuccessEffect() {
            successSound.currentTime = 0; successSound.play();
            const qCard = document.getElementById('q-card');
            const flash = document.getElementById('flash-overlay');
            flash.className = "flash-green";
            qCard.classList.add('correct-animation'); flash.style.opacity = "1";
            setTimeout(() => { qCard.classList.remove('correct-animation'); flash.style.opacity = "0"; }, 500);
        }

        window.handleAuth = async () => {
            const name = document.getElementById('login-name').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (!name) return;
            if (name.toLowerCase() === 'admin' && pass === "Daniel777") {
                userState.isAdmin = true;
                document.getElementById('admin-back-btn').classList.remove('hidden');
                initAdmin(); return;
            }
            userState.name = name;
            await setDoc(doc(db, "players", name), { name, score:0, qIndex:0, lives:3, dead:false, time:0, lastUpdate: Date.now() });
            window.showView('levels'); syncGlobal();
        };

        function syncGlobal() {
            onSnapshot(doc(db, "config", "game"), (snap) => {
                const data = snap.data() || { levels: {}, showResults: false, globalLives: 3, chatLocked: false, showCitas: false, timerLimit: 30 };
                gameConfig = data;
                renderLevelGrid();
                
                const resultsView = document.getElementById('global-results');
                if(data.showResults && !userState.isAdmin) {
                    resultsView.classList.remove('hidden');
                    loadGlobalRanking();
                } else {
                    resultsView.classList.add('hidden');
                }
                
                if(userState.isAdmin) {
                    refreshAdminStatus();
                    document.getElementById('adm-timer-limit').value = gameConfig.timerLimit || 30;
                }
                updateCodeVisibility();
            });

            onSnapshot(collection(db, "chat"), (snap) => {
                const box = document.getElementById('chat-messages'); box.innerHTML = "";
                snap.docs.reverse().forEach(d => {
                    const m = d.data();
                    box.innerHTML += `<div class="mb-3 text-[11px] bg-white/5 p-2 rounded-lg border-l-2 border-yellow-600"><b class="text-yellow-600 uppercase">${m.user}:</b> <span class="text-zinc-300 ml-2">${m.text}</span></div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        async function loadGlobalRanking() {
            const list = document.getElementById('results-list');
            const snap = await getDocs(collection(db, "players"));
            const players = snap.docs.map(d => d.data()).sort((a,b) => b.score - a.score);
            
            list.innerHTML = players.map((p, i) => `
                <div class="card-glass p-4 rounded-2xl flex justify-between items-center border-l-4 ${i < 3 ? 'border-yellow-500' : 'border-zinc-700'}">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl font-royal text-yellow-500">#${i+1}</span>
                        <div>
                            <p class="font-bold uppercase ${p.dead ? 'text-red-500' : 'text-white'}">${p.name}</p>
                            <p class="text-[10px] text-zinc-500 uppercase">Pregunta: ${p.qIndex}/20 | Tiempo: ${formatTime(p.time || 0)}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-royal text-yellow-500">${p.score}</p>
                        <p class="text-[8px] text-zinc-500 uppercase font-bold">PUNTOS</p>
                    </div>
                </div>
            `).join('');
        }

        function renderLevelGrid() {
            const grid = document.getElementById('level-grid'); if(!grid) return;
            grid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const lvlData = gameConfig.levels?.[i.toString()] || {};
                const isActive = lvlData.active;
                grid.innerHTML += `<div class="level-card ${isActive ? 'active' : 'locked'}" onclick="enterLobby(${i})"><img src="${DEFAULT_IMAGES[i]}" class="w-full h-full object-cover"></div>`;
            }
        }

        window.enterLobby = (lvl) => { 
            activeLevelLobby = lvl;
            document.getElementById('lobby-title').innerText = "CAPÍTULO " + lvl;
            document.getElementById('lobby-video-src').src = LEVEL_VIDEOS[lvl] || "default.mp4";
            lobbyVideo.load(); window.showView('lobby'); updateCodeVisibility();
        };

        window.validateAccessCode = () => {
            if(document.getElementById('join-code-input').value.trim() === gameConfig.levels?.[activeLevelLobby]?.code) startQuiz();
            else Swal.fire("Denegado", "El código es incorrecto.", "error");
        };

        async function startQuiz() {
            const snap = await getDoc(doc(db, "levels", "lvl_" + activeLevelLobby));
            if(!snap.exists()) return;
            currentLevelQuestions = snap.data().questions.sort(() => Math.random() - 0.5).slice(0, 20);
            userState.lives = gameConfig.globalLives || 3; 
            userState.qIndex = 0; userState.score = 0; userState.startTime = Date.now();
            window.showView('game'); runQuiz();
        }

        function runQuiz() {
            if(questionInterval) clearInterval(questionInterval);
            if(userState.qIndex >= currentLevelQuestions.length || userState.lives <= 0) { finishBattle(); return; }
            
            const q = currentLevelQuestions[userState.qIndex];
            document.getElementById('q-index').innerText = `DESAFÍO ${userState.qIndex+1} / 20`;
            document.getElementById('q-text').innerText = q.Pregunta;
            document.getElementById('game-lives').innerHTML = `<i class="fa-solid fa-heart gold-heart"></i>`.repeat(userState.lives);
            document.getElementById('game-score').innerText = userState.score;
            
            const grid = document.getElementById('options-grid'); grid.innerHTML = "";
            [q.Correcta, q.Inc1, q.Inc2, q.Inc3].filter(o => o).sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = "btn-option p-4 rounded-2xl text-left text-xs font-bold uppercase";
                b.innerText = o;
                b.onclick = () => handleAnswer(o === q.Correcta);
                grid.appendChild(b);
            });

            startQuestionTimer();
        }

        function startQuestionTimer() {
            const limit = parseInt(gameConfig.timerLimit) || 30;
            let remaining = limit;
            const bar = document.getElementById('timer-bar');
            const icon = document.getElementById('hourglass-icon');
            
            bar.style.backgroundColor = "var(--gold)";
            icon.className = "fa-solid fa-hourglass-half text-yellow-500 text-2xl animate-hourglass";

            questionInterval = setInterval(() => {
                remaining -= 0.1;
                const percent = (remaining / limit) * 100;
                bar.style.width = percent + "%";
                
                if (percent <= 25) {
                    bar.style.backgroundColor = "#ff4d4d";
                    icon.classList.replace('text-yellow-500', 'text-red-500');
                }

                if (remaining <= 0) {
                    clearInterval(questionInterval);
                    handleAnswer(false);
                }
            }, 100);
        }

        function handleAnswer(isCorrect) {
            if(questionInterval) clearInterval(questionInterval);
            if(isCorrect) {
                userState.score += 100;
                triggerSuccessEffect();
            } else {
                userState.lives--;
                triggerDamageEffect();
            }
            userState.qIndex++;
            updateStats();
            setTimeout(runQuiz, 600);
        }

        async function updateStats() {
            userState.totalTime = Math.floor((Date.now() - userState.startTime)/1000);
            document.getElementById('game-timer-label').innerText = formatTime(userState.totalTime);
            await updateDoc(doc(db, "players", userState.name), { 
                score: userState.score, qIndex: userState.qIndex, lives: userState.lives, 
                dead: userState.lives <= 0, time: userState.totalTime, lastUpdate: Date.now() 
            });
        }

        function formatTime(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }

        // --- LÓGICA DE VIDEO Y LUEGO IMAGEN FINAL ---
        function finishBattle() {
            const win = userState.lives > 0 && userState.qIndex >= 20;
            
            // Pausar música durante el video
            gameMusic.pause();

            outcomePlayer.src = win ? "gano.mp4" : "perdio.mp4";
            document.getElementById('video-outcome').classList.remove('hidden');
            outcomePlayer.play();

            // Cuando el video termina, mostrar imagen vertical
            outcomePlayer.onended = () => {
                document.getElementById('video-outcome').classList.add('hidden');
                const finalImgScreen = document.getElementById('final-image-screen');
                const finalImgContent = document.getElementById('final-image-content');
                
                // Nombres de tus imágenes verticales (Asegúrate de tenerlas)
                finalImgContent.src = win ? "ganaste_vertical.jpg" : "perdiste_vertical.jpg";
                finalImgScreen.style.display = "flex";
            };
        }

        window.closeOutcomeVideo = () => {
            document.getElementById('final-image-screen').style.display = "none";
            document.getElementById('video-outcome').classList.add('hidden');
            gameMusic.play(); 
            window.showView('levels');
        };

        // ADMIN FUNCTIONS
        function initAdmin() { window.showView('admin'); syncGlobal(); }

        window.updateGlobalConfigs = async () => {
            await updateDoc(doc(db, "config", "game"), { 
                globalLives: parseInt(document.getElementById('adm-diff').value),
                timerLimit: parseInt(document.getElementById('adm-timer-limit').value),
                chatLocked: document.getElementById('adm-lock-chat').checked,
                showCitas: document.getElementById('adm-show-citas').checked
            });
        };

        window.toggleResults = async (val) => { 
            await updateDoc(doc(db, "config", "game"), { showResults: val }); 
        };

        // --- ELIMINAR CHAT COMPLETO ---
        window.deleteFullChat = async () => {
            if(confirm("¿ESTÁS SEGURO DE ELIMINAR TODO EL CHAT? Esto no se puede deshacer.")) {
                const chatSnap = await getDocs(collection(db, "chat"));
                const batch = writeBatch(db);
                chatSnap.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
                Swal.fire("Éxito", "Chat borrado completamente", "success");
            }
        };

        window.toggleLvlState = async (lvl) => {
            const newLevels = {...(gameConfig.levels || {})};
            const current = newLevels[lvl] || { active: false, code: '' };
            current.active = !current.active;
            current.code = current.active ? Math.floor(1000 + Math.random() * 9000).toString() : '';
            newLevels[lvl] = current;
            await updateDoc(doc(db, "config", "game"), { levels: newLevels });
        };

        async function refreshAdminStatus() {
            const container = document.getElementById('adm-levels-controls'); if(!container) return;
            container.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const active = gameConfig.levels?.[i]?.active;
                container.innerHTML += `
                    <div class="p-3 bg-white/5 rounded-xl border border-white/10 flex flex-col gap-2">
                        <span class="text-[10px] uppercase font-bold">Nivel ${i}</span>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="adminPickExcel(${i})" class="bg-zinc-800 py-2 rounded text-[8px] uppercase">Excel</button>
                            <button onclick="toggleLvlState(${i})" class="py-2 rounded text-[8px] ${active?'bg-red-900':'bg-green-900'} uppercase">${active?'OFF':'ON'}</button>
                        </div>
                        ${active ? `<div class="text-center text-yellow-500 font-bold text-[9px]">COD: ${gameConfig.levels[i].code}</div>` : ''}
                    </div>`;
            }
        }

        window.adminPickExcel = (lvl) => { adminLvlTarget = lvl; document.getElementById('adm-excel-input').click(); };
        document.getElementById('adm-excel-input').onchange = (e) => {
            const r = new FileReader();
            r.onload = async (ev) => {
                const book = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                const raw = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                const data = raw.map(row => {
                    let n = {};
                    Object.keys(row).forEach(k => {
                        let key = k.toLowerCase().trim();
                        if(key.includes("pregunta")) n.Pregunta = row[k];
                        else if(key.includes("correcta")) n.Correcta = row[k];
                        else if(key.includes("inc1")) n.Inc1 = row[k];
                        else if(key.includes("inc2")) n.Inc2 = row[k];
                        else if(key.includes("inc3")) n.Inc3 = row[k];
                    });
                    return n;
                });
                await setDoc(doc(db, "levels", "lvl_" + adminLvlTarget), { questions: data });
                Swal.fire("Cargado", "Nivel listo", "success");
            };
            r.readAsArrayBuffer(e.target.files[0]);
        };

        onSnapshot(collection(db, "players"), (snap) => {
            const m = document.getElementById('adm-monitor'); if(!m) return;
            m.innerHTML = "";
            snap.docs.map(d => d.data()).sort((a,b)=>b.score-a.score).forEach(p => {
                m.innerHTML += `<div class="p-3 bg-black/40 rounded-lg flex flex-col gap-1 text-[10px] border border-white/5">
                    <div class="flex justify-between items-center">
                        <span class="${p.dead?'text-red-500':'text-yellow-500'} uppercase font-bold text-sm">${p.name}</span>
                        <button onclick="deleteUser('${p.name}')" class="text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-zinc-400">
                        <span>Preg: <b class="text-white">${p.qIndex}/20</b></span>
                        <span>Pts: <b class="text-yellow-500">${p.score}</b></span>
                        <span>Vidas: <b class="text-red-500">${p.lives}</b></span>
                        <span>Tiempo: <b class="text-blue-400">${formatTime(p.time || 0)}</b></span>
                    </div>
                </div>`;
            });
            if(gameConfig.showResults) loadGlobalRanking();
        });

        window.deleteUser = async (name) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "players", name)); };

        window.resetGlobalSystem = async () => {
            if(confirm("¿REINICIAR TODO EL JUEGO?")) {
                const p = await getDocs(collection(db, "players")); p.forEach(async d => await deleteDoc(doc(db, "players", d.id)));
                await setDoc(doc(db, "config", "game"), { levels: {}, showResults: false, globalLives: 3, chatLocked: false, showCitas: false, timerLimit: 30 });
                location.reload();
            }
        };

        window.sendChatMessage = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "chat"), { user: userState.isAdmin ? 'ADMIN' : userState.name, text: i.value, time: Date.now() });
            i.value = "";
        };

        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');
        function updateCodeVisibility() {
            if(activeLevelLobby > 0) {
                const btn = document.getElementById('access-code-prompt');
                if(btn) btn.classList.toggle('hidden', !gameConfig.levels?.[activeLevelLobby]?.active);
            }
        }
    </script>
</body>
</html>
