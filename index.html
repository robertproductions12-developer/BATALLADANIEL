<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel: El Desafío Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        #video-bg-container { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: hidden; }
        #video-bg-container video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3); }

        #intro-overlay { position: fixed; inset: 0; z-index: 1000; background: black; display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease, visibility 1.5s; }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; }

        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); text-transform: uppercase;
        }
        .btn-gold:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-option { background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(212, 175, 55, 0.3); transition: all 0.2s; }
        .btn-option:hover { background: rgba(212, 175, 55, 0.2); border-color: var(--gold); }
        
        .card-glass { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.1); }
        .level-card { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 1.5rem; border: 2px solid rgba(212, 175, 55, 0.2); cursor: pointer; transition: 0.4s; }
        .level-card.locked { filter: grayscale(1) opacity(0.5); cursor: not-allowed; }
        .progress-bar { transition: width 0.5s ease-in-out; }
        .hidden { display: none !important; }

        .badge { padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: bold; text-transform: uppercase; }
        .badge-green { background: #065f46; color: #34d399; }
        .badge-red { background: #7f1d1d; color: #f87171; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- VIDEO INTRO: Cambia 'intro.mp4' por tu ruta -->
    <div id="intro-overlay">
        <video id="intro-video" playsinline autoplay muted loop class="w-full h-full object-cover">
            <source src="intro.mp4" type="video/mp4">
        </video>
        <button onclick="endIntro()" class="absolute bottom-10 btn-gold px-8 py-4 rounded-full text-sm tracking-widest">Entrar a la Cueva</button>
    </div>

    <!-- VIDEO FONDO: Cambia 'intro.mp4' por tu ruta -->
    <div id="video-bg-container">
        <video id="bg-video-loop" loop playsinline muted>
            <source src="intro.mp4" type="video/mp4">
        </video>
    </div>

    <div id="main-content" class="relative z-10 opacity-0 transition-opacity duration-1000">
        
        <!-- LOGIN -->
        <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-6">
            <h1 class="font-royal text-5xl md:text-8xl mb-2 text-yellow-500 text-center drop-shadow-2xl">DANIEL</h1>
            <p class="text-[9px] tracking-[0.6em] mb-12 text-zinc-400 uppercase">El Desafío Profético</p>
            <div class="card-glass p-8 rounded-[2rem] w-full max-w-sm">
                <input type="text" id="login-name" placeholder="Tu Nombre" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-lg text-white outline-none focus:border-yellow-600">
                <div id="admin-pass-container" class="hidden">
                    <input type="password" id="login-pass" placeholder="Clave de Mando" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-white outline-none">
                </div>
                <button onclick="handleAuth()" class="btn-gold w-full py-4 rounded-xl text-lg font-bold">Comenzar</button>
                <button onclick="toggleAdminField()" class="text-[10px] mt-6 text-zinc-600 underline uppercase block mx-auto tracking-widest">Acceso Jerárquico</button>
            </div>
        </div>

        <!-- MAPA DE NIVELES -->
        <div id="view-levels" class="hidden min-h-screen p-4 md:p-8">
            <header class="flex justify-between items-center mb-8 max-w-7xl mx-auto">
                <h2 class="font-royal text-2xl md:text-4xl text-white">MISIONES</h2>
                <button onclick="location.reload()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-lg text-xs font-bold border border-red-900/50">SALIR</button>
            </header>
            <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-8 max-w-7xl mx-auto"></div>
        </div>

        <!-- LOBBY / CHAT -->
        <div id="view-lobby" class="hidden min-h-screen flex flex-col p-4 md:p-6 max-w-4xl mx-auto">
            <div class="card-glass p-4 rounded-2xl mb-4 flex flex-col md:flex-row gap-4 justify-between items-center">
                <h2 id="lobby-title" class="font-royal text-xl text-yellow-500 uppercase">SALA DE ESPERA</h2>
                <div id="access-code-prompt" class="hidden flex gap-2">
                    <input type="text" id="join-code-input" placeholder="CÓDIGO" class="bg-black border border-yellow-600/50 p-2 rounded-lg w-20 text-center text-yellow-500 font-bold outline-none">
                    <button onclick="validateAccessCode()" class="btn-gold px-4 rounded-lg text-[10px]">Unirse</button>
                </div>
                <button id="admin-back-btn" onclick="showView('admin')" class="hidden bg-zinc-800 px-4 py-2 rounded-lg text-[10px] uppercase font-bold text-zinc-300">Panel Mando</button>
            </div>
            <div class="flex-1 card-glass rounded-2xl p-4 mb-4 overflow-y-auto min-h-[300px]" id="chat-messages"></div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Mensaje..." class="flex-1 bg-black/50 border border-zinc-800 p-3 rounded-xl text-white outline-none text-sm">
                <button onclick="sendChatMessage()" class="btn-gold px-6 rounded-xl font-bold text-sm">Enviar</button>
            </div>
        </div>

        <!-- QUIZ -->
        <div id="view-game" class="hidden min-h-screen flex flex-col p-4 max-w-xl mx-auto justify-center">
            <div class="flex justify-between items-center mb-6">
                <div id="game-lives" class="text-xl"></div>
                <div class="text-right"><span id="game-score" class="text-2xl font-bold text-yellow-500 font-royal">0</span></div>
            </div>
            <div class="card-glass p-6 md:p-8 rounded-[2rem] flex flex-col min-h-[400px]">
                <p id="q-index" class="text-center text-[10px] text-yellow-600 font-bold mb-4 tracking-widest uppercase"></p>
                <h3 id="q-text" class="text-xl md:text-2xl text-center font-semibold mb-8 leading-tight"></h3>
                <div id="options-grid" class="grid grid-cols-1 gap-3"></div>
                <p id="q-cita" class="mt-8 text-center italic text-xs text-zinc-500 hidden"></p>
            </div>
        </div>

        <!-- ADMIN -->
        <div id="view-admin" class="hidden min-h-screen p-4 md:p-8">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                    <button onclick="enterAdminLobby()" class="w-full md:w-auto bg-blue-900/40 text-blue-400 px-6 py-3 rounded-xl border border-blue-900 font-bold text-[10px] uppercase">Ir a la Sala</button>
                    <h2 class="font-royal text-2xl md:text-4xl text-red-600 text-center">PANEL DE MANDO</h2>
                    <button onclick="resetGlobalSystem()" class="w-full md:w-auto bg-red-900/40 text-red-400 px-6 py-3 rounded-xl border border-red-900 font-bold text-[10px] uppercase">Reiniciar Sistema</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Configuración -->
                    <div class="card-glass p-5 rounded-2xl">
                        <h3 class="text-yellow-500 font-royal mb-4 border-b border-zinc-800 pb-2 text-sm uppercase">Misión</h3>
                        <select id="adm-level-sel" class="w-full bg-black border border-zinc-800 p-3 rounded-xl mb-3 text-white text-sm">
                            <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">Capítulo ${i}</option>`)</script>
                        </select>
                        <input type="text" id="adm-img-url" placeholder="URL Imagen Nivel" class="w-full bg-black border border-zinc-800 p-3 rounded-xl mb-3 text-xs">
                        <button onclick="updateLevelImage()" class="w-full bg-zinc-800 text-white p-2 rounded-lg text-[10px] mb-4 uppercase font-bold">Guardar Imagen</button>
                        
                        <div class="space-y-3">
                            <select id="adm-diff" class="w-full bg-black border border-zinc-800 p-3 rounded-xl text-white text-xs">
                                <option value="6">6 Vidas</option><option value="3" selected>3 Vidas</option><option value="1">1 Vida</option>
                            </select>
                            <label class="flex items-center gap-2 cursor-pointer bg-black/30 p-3 rounded-xl border border-zinc-800">
                                <input type="checkbox" id="adm-show-cita" class="w-4 h-4 accent-yellow-500"> <span class="text-[10px] uppercase">Citas Bíblicas</span>
                            </label>
                            <button onclick="activateLevel()" class="btn-gold w-full py-4 rounded-xl text-sm font-bold">ACTIVAR NIVEL</button>
                            <div id="adm-active-code" class="text-center text-3xl font-bold text-yellow-500 tracking-widest"></div>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="card-glass p-5 rounded-2xl">
                        <h3 class="text-yellow-500 font-royal mb-4 border-b border-zinc-800 pb-2 text-sm uppercase">Estado</h3>
                        <div id="adm-levels-status" class="grid grid-cols-2 gap-2 text-[8px]"></div>
                        <div class="mt-6">
                            <input type="file" id="adm-excel" accept=".xlsx" class="hidden" onchange="processExcel(this)">
                            <button onclick="document.getElementById('adm-excel').click()" class="w-full py-6 border-2 border-dashed border-zinc-800 rounded-xl text-zinc-500 font-bold text-center text-[10px] uppercase">Subir Preguntas .xlsx</button>
                        </div>
                    </div>

                    <!-- Ranking -->
                    <div class="card-glass p-5 rounded-2xl">
                        <h3 class="text-yellow-500 font-royal mb-4 border-b border-zinc-800 pb-2 text-sm uppercase">Ranking en Vivo</h3>
                        <div id="adm-monitor" class="space-y-2 max-h-[400px] overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, query, orderBy, limit, getDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let userState = { name: '', isAdmin: false, lives: 3, score: 0, qIndex: 0, dead: false, startTime: 0 };
        let gameConfig = { activeLevel: 0, activeCode: '', diff: 3, showCita: false, status: 'waiting' };
        let levelImages = {};
        let levelDocs = {};

        // VIDEO LOGIC
        const introVid = document.getElementById('intro-video');
        const bgLoop = document.getElementById('bg-video-loop');

        window.endIntro = () => {
            document.getElementById('intro-overlay').classList.add('fade-out');
            document.getElementById('main-content').classList.remove('opacity-0');
            bgLoop.play().catch(()=>{}); 
            introVid.pause();
        };

        // AUTH
        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');
        window.handleAuth = async () => {
            const name = document.getElementById('login-name').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (!name) return;
            if (name.toLowerCase() === 'admin' && pass === "Daniel777") {
                userState.isAdmin = true;
                document.getElementById('admin-back-btn').classList.remove('hidden');
                initAdmin(); return;
            }
            userState.name = name;
            await setDoc(doc(db, "players", name), { name, score:0, qIndex:0, lives:3, dead:false, time:0, status:'online' });
            showView('levels');
            syncGlobal();
        };

        function syncGlobal() {
            onSnapshot(doc(db, "config", "game"), (snap) => {
                const data = snap.data(); if(!data) return;
                gameConfig = data;
                renderLevelGrid();
                renderAdminStatus();
                document.getElementById('access-code-prompt').classList.toggle('hidden', data.status !== 'active');
            });
            onSnapshot(collection(db, "chat"), (snap) => {
                const box = document.getElementById('chat-messages'); box.innerHTML = "";
                snap.docs.reverse().forEach(d => {
                    const m = d.data();
                    box.innerHTML += `<div class="mb-2 text-xs"><b class="text-yellow-600 uppercase">${m.user}:</b> <span class="text-zinc-300">${m.text}</span></div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
            onSnapshot(doc(db, "config", "images"), (snap) => {
                levelImages = snap.data() || {};
                renderLevelGrid(); renderAdminStatus();
            });
        }

        function renderLevelGrid() {
            const grid = document.getElementById('level-grid'); if(!grid) return;
            grid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const isActive = (gameConfig.activeLevel == i && gameConfig.status === 'active');
                const img = levelImages[i] || "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500";
                grid.innerHTML += `
                    <div class="level-card ${isActive ? '' : 'locked'}" onclick="${isActive ? 'enterLobby('+i+')' : 'alertLocked()'}">
                        <img src="${img}" class="w-full h-full object-cover">
                        <div class="level-overlay-num">${i}</div>
                        ${isActive ? '<div class="absolute inset-0 bg-yellow-500/20 animate-pulse"></div>' : ''}
                    </div>`;
            }
        }

        window.enterLobby = (lvl) => { 
            document.getElementById('lobby-title').innerText = "CAPÍTULO " + lvl; 
            showView('lobby'); 
        };

        window.enterAdminLobby = () => {
            if(!userState.isAdmin) return;
            document.getElementById('lobby-title').innerText = "SALA DE MANDO (ADMIN)";
            showView('lobby');
        };

        window.alertLocked = () => Swal.fire("Nivel Sellado", "Espera a que se abra el sello profético.", "warning");

        window.sendChatMessage = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "chat"), { user: userState.isAdmin ? 'REINO' : userState.name, text: i.value, time: Date.now() });
            i.value = "";
        };

        window.validateAccessCode = async () => {
            const code = document.getElementById('join-code-input').value.trim();
            if(code === gameConfig.activeCode) startQuiz();
            else Swal.fire("Código Erróneo", "Pregunta al Administrador", "error");
        };

        async function startQuiz() {
            const snap = await getDoc(doc(db, "levels", "lvl_" + gameConfig.activeLevel));
            if(!snap.exists()) return Swal.fire("Error", "No hay preguntas cargadas.", "error");
            const qs = snap.data().questions.sort(() => Math.random() - 0.5).slice(0, 20);
            userState.lives = gameConfig.diff; userState.qIndex = 0; userState.score = 0; userState.startTime = Date.now();
            showView('game'); runQuiz(qs);
        }

        function runQuiz(qs) {
            if(userState.qIndex >= qs.length || userState.lives <= 0) return endQuiz();
            const q = qs[userState.qIndex];
            document.getElementById('q-index').innerText = `DESAFÍO ${userState.qIndex+1}/20`;
            document.getElementById('q-text').innerText = q.Pregunta;
            document.getElementById('game-lives').innerHTML = "❤️".repeat(userState.lives);
            document.getElementById('game-score').innerText = userState.score;
            
            const ct = document.getElementById('q-cita');
            if(gameConfig.showCita) { ct.innerText = q.Cita; ct.classList.remove('hidden'); } else ct.classList.add('hidden');

            const grid = document.getElementById('options-grid'); grid.innerHTML = "";
            [q.Correcta, q.Inc1, q.Inc2, q.Inc3].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = "btn-option p-4 rounded-xl text-left text-[10px] font-bold uppercase";
                b.innerText = o;
                b.onclick = () => {
                    if(o === q.Correcta) { userState.score += 100; userState.qIndex++; }
                    else { userState.lives--; if(userState.lives > 0) userState.qIndex++; }
                    updateFB(); runQuiz(qs);
                };
                grid.appendChild(b);
            });
        }

        async function updateFB() {
            const time = Math.floor((Date.now() - userState.startTime)/1000);
            await updateDoc(doc(db, "players", userState.name), { score: userState.score, qIndex: userState.qIndex, lives: userState.lives, dead: userState.lives<=0, time });
        }

        function endQuiz() {
            const ok = userState.lives > 0 && userState.qIndex >= 20;
            Swal.fire({ title: ok ? 'MISIÓN CUMPLIDA' : 'DERROTADO', text: `Puntos: ${userState.score}`, icon: ok ? 'success' : 'error' }).then(()=>showView('levels'));
        }

        function initAdmin() {
            showView('admin'); syncGlobal();
            onSnapshot(collection(db, "players"), (snap) => {
                const m = document.getElementById('adm-monitor'); m.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data(); const per = (p.qIndex/20)*100;
                    m.innerHTML += `
                        <div class="bg-black/50 p-2 rounded-xl border border-zinc-800">
                            <div class="flex justify-between text-[8px] font-bold uppercase mb-1">
                                <span class="${p.dead ? 'text-red-500' : 'text-yellow-500'}">${p.name}</span>
                                <span>${p.score} pts</span>
                            </div>
                            <div class="h-1 bg-zinc-900 rounded-full overflow-hidden"><div class="progress-bar h-full ${p.dead?'bg-red-800':'bg-yellow-600'}" style="width:${per}%"></div></div>
                        </div>`;
                });
            });
            refreshLevelStatus();
        }

        async function refreshLevelStatus() {
            for(let i=1; i<=12; i++) {
                const s = await getDoc(doc(db, "levels", "lvl_" + i));
                levelDocs[i] = s.exists();
            }
            renderAdminStatus();
        }

        function renderAdminStatus() {
            const grid = document.getElementById('adm-levels-status'); if(!grid) return;
            grid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const active = (gameConfig.activeLevel == i);
                const hasDoc = levelDocs[i];
                grid.innerHTML += `
                    <div class="bg-black/40 p-2 rounded border border-zinc-800">
                        <div class="mb-1">Misión ${i}</div>
                        <div class="flex gap-1">
                            <span class="badge ${active?'badge-green':'badge-red'}">${active?'Activo':'Off'}</span>
                            <span class="badge ${hasDoc?'badge-green':'badge-red'}">${hasDoc?'Doc':'Vacío'}</span>
                        </div>
                    </div>`;
            }
        }

        window.updateLevelImage = async () => {
            const lvl = document.getElementById('adm-level-sel').value;
            const url = document.getElementById('adm-img-url').value;
            if(!url) return;
            const up = {}; up[lvl] = url;
            await setDoc(doc(db, "config", "images"), up, { merge: true });
            Swal.fire("Éxito", "Imagen guardada", "success");
        };

        window.activateLevel = async () => {
            const lvl = document.getElementById('adm-level-sel').value;
            if(!levelDocs[lvl]) return Swal.fire("Error", "Sube el Excel primero.", "error");
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            await setDoc(doc(db, "config", "game"), { activeLevel: lvl, activeCode: code, diff: parseInt(document.getElementById('adm-diff').value), showCita: document.getElementById('adm-show-cita').checked, status: 'active' });
            document.getElementById('adm-active-code').innerText = code;
        };

        window.resetGlobalSystem = async () => {
            const confirm = await Swal.fire({ title: '¿REINICIAR TODO?', text: "Se borrarán jugadores y chat.", icon: 'warning', showCancelButton: true });
            if(!confirm.isConfirmed) return;
            const players = await getDocs(collection(db, "players"));
            players.forEach(async d => await deleteDoc(doc(db, "players", d.id)));
            const chat = await getDocs(collection(db, "chat"));
            chat.forEach(async d => await deleteDoc(doc(db, "chat", d.id)));
            await updateDoc(doc(db, "config", "game"), { status: 'waiting', activeLevel: 0 });
            Swal.fire("Limpio", "Sistema reiniciado", "success");
        };

        window.processExcel = (input) => {
            const lvl = document.getElementById('adm-level-sel').value;
            const r = new FileReader();
            r.onload = async (e) => {
                const book = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                await setDoc(doc(db, "levels", "lvl_" + lvl), { questions: json });
                refreshLevelStatus();
                Swal.fire("Éxito", "Excel cargado", "success");
            };
            r.readAsArrayBuffer(input.files[0]);
        };

        function showView(id) {
            ['view-login', 'view-levels', 'view-lobby', 'view-game', 'view-admin'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
        }
    </script>
</body>
</html>
