<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel: El Desafío Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,255,255,0.5);
            border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-gold:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(191, 149, 63, 0.4); }
        .btn-option {
            background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-option:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }
        .card-glass { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .level-card { 
            position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 1.5rem;
            cursor: pointer; transition: all 0.6s ease; border: 2px solid rgba(212, 175, 55, 0);
        }
        .level-card.locked { filter: grayscale(1) brightness(0.2); pointer-events: none; }
        .level-card.active { filter: grayscale(0) brightness(1.1); border-color: var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
        .level-card img { width: 100%; height: 100%; object-fit: cover; }
        .level-overlay-num { 
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 5rem; font-family: 'Cinzel'; color: rgba(255,255,255,0.15); font-weight: 900;
        }
        .hidden { display: none !important; }
        .progress-line { transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
    </style>
</head>
<body>

    <!-- VIDEO DE VICTORIA -->
    <div id="view-victory" class="hidden fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black">
        <video id="vid-player" playsinline class="w-full h-full object-cover">
            <source src="" type="video/mp4">
        </video>
        <div class="absolute bottom-10 z-[210]">
            <button onclick="backToCamp()" class="btn-gold px-12 py-4 rounded-full text-xl">Volver al Campamento</button>
        </div>
    </div>

    <!-- 1. LOGIN -->
    <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900 to-black">
        <h1 class="font-royal text-7xl mb-2 text-yellow-500 drop-shadow-2xl text-center">DANIEL</h1>
        <p class="text-sm tracking-[0.6em] mb-16 text-zinc-500 uppercase text-center">El Desafío de los Reinos</p>
        
        <div class="card-glass p-10 rounded-[2rem] w-full max-w-md">
            <input type="text" id="login-name" placeholder="Escribe tu Nombre" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl mb-5 text-center text-xl outline-none focus:border-yellow-600 transition-colors">
            <div id="admin-pass-container" class="hidden">
                <input type="password" id="login-pass" placeholder="Clave de Mando" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl mb-5 text-center outline-none">
            </div>
            <button onclick="handleAuth()" class="btn-gold w-full py-5 rounded-2xl text-xl tracking-tighter">Comenzar</button>
            <button onclick="toggleAdminField()" class="text-[10px] mt-8 text-zinc-700 underline uppercase block mx-auto tracking-widest">Acceso Jerárquico</button>
        </div>
    </div>

    <!-- 2. MAPA DE NIVELES -->
    <div id="view-levels" class="hidden min-h-screen p-6 md:p-12">
        <header class="flex justify-between items-end mb-12 max-w-7xl mx-auto">
            <div>
                <p id="player-welcome" class="text-zinc-500 text-xs tracking-widest uppercase mb-1"></p>
                <h2 class="font-royal text-4xl text-yellow-500 uppercase">Misiones</h2>
            </div>
            <button onclick="location.reload()" class="bg-zinc-900 text-zinc-400 px-6 py-2 rounded-xl text-xs font-bold border border-zinc-800 hover:text-red-500 transition">SALIR</button>
        </header>
        <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"></div>
    </div>

    <!-- 3. LOBBY / CHAT -->
    <div id="view-lobby" class="hidden min-h-screen flex flex-col p-6 max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <button onclick="showView('levels')" class="bg-zinc-900 p-3 rounded-full text-yellow-600">←</button>
            <h2 id="lobby-title" class="font-royal text-2xl text-yellow-500 tracking-widest uppercase">Lobby</h2>
            <div class="w-10"></div>
        </header>
        <div class="flex-1 card-glass rounded-3xl p-6 mb-6 overflow-y-auto" id="chat-messages"></div>
        <div class="flex gap-3 mb-8">
            <input type="text" id="chat-input" placeholder="Mensaje para el campamento..." class="flex-1 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none focus:border-yellow-600">
            <button onclick="sendChatMessage()" class="btn-gold px-8 rounded-2xl font-royal">Enviar</button>
        </div>
        <div class="text-center p-10 border-2 border-dashed border-yellow-900/30 rounded-[2.5rem] bg-yellow-900/5">
            <p class="text-yellow-600 font-bold uppercase tracking-widest mb-2 animate-pulse text-sm">Esperando inicio por el Administrador</p>
        </div>
    </div>

    <!-- 4. QUIZ / BATALLA -->
    <div id="view-game" class="hidden min-h-screen flex flex-col p-6 max-w-md mx-auto justify-center">
        <div class="flex justify-between items-center mb-8">
            <div id="lives-display" class="flex gap-1 text-2xl"></div>
            <div class="text-right">
                <span id="score-display" class="text-3xl font-bold text-yellow-500 font-royal">0</span>
            </div>
        </div>
        <div id="group-progress" class="mb-10 space-y-4"></div>
        <div class="card-glass p-8 rounded-[3rem] relative flex flex-col min-h-[500px]">
            <p id="q-meta" class="text-[11px] text-yellow-600 font-bold mb-6 tracking-[0.2em] uppercase text-center border-b border-zinc-800 pb-4"></p>
            <h3 id="q-text" class="text-2xl font-semibold mb-12 leading-tight text-center"></h3>
            <div id="options-grid" class="grid grid-cols-1 gap-4"></div>
            <div id="q-cite" class="mt-auto pt-10 text-[11px] italic text-zinc-600 text-center"></div>
        </div>
    </div>

    <!-- 5. ADMIN -->
    <div id="view-admin" class="hidden min-h-screen p-8 bg-zinc-950">
        <div class="max-w-7xl mx-auto text-center">
            <h2 class="font-royal text-4xl text-red-600 mb-12">ADMINISTRADOR</h2>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <div class="card-glass p-8 rounded-[2.5rem]">
                    <h3 class="text-yellow-500 mb-6 font-royal">Ajustes</h3>
                    <select id="adm-level" class="w-full bg-black p-4 rounded-xl mb-4 border border-zinc-800 text-sm"></select>
                    <select id="adm-difficulty" class="w-full bg-black p-4 rounded-xl mb-6 border border-zinc-800 text-sm">
                        <option value="10">Fácil (10 Vidas)</option>
                        <option value="5" selected>Normal (5 Vidas)</option>
                        <option value="3">Difícil (3 Vidas)</option>
                        <option value="1">Supervivencia (1 Vida)</option>
                    </select>
                    <button id="btn-toggle-game" onclick="toggleGameState()" class="w-full py-5 rounded-2xl btn-gold text-sm"></button>
                </div>
                <div class="card-glass p-8 rounded-[2.5rem]">
                    <h3 class="text-yellow-500 mb-6 font-royal">Cargar Excel</h3>
                    <input type="file" id="adm-excel" accept=".xlsx" class="hidden" onchange="processExcel(this)">
                    <button onclick="document.getElementById('adm-excel').click()" class="w-full py-16 border-2 border-dashed border-zinc-800 rounded-3xl text-zinc-500 text-xs hover:border-yellow-600 transition uppercase font-bold">Subir Archivo .xlsx</button>
                </div>
                <div class="card-glass p-8 rounded-[2.5rem]">
                    <h3 class="text-yellow-500 mb-6 font-royal">Ranking Vivo</h3>
                    <div id="adm-player-list" class="space-y-4"></div>
                </div>
            </div>
            <button onclick="location.reload()" class="mt-20 text-zinc-600 underline uppercase text-[10px] tracking-widest">Cerrar Sesión</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, deleteDoc, query, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- PREGUNTAS LOCALES (BASE DE DATOS INTEGRADA) ---
        // Aquí puedes editar todas las preguntas sin necesidad de Excel.
        const LOCAL_DATA = {
            1: [
                { Pregunta: "¿Quién era el rey de Babilonia cuando llevaron cautivo a Daniel?", Correcta: "Nabucodonosor", Inc1: "Belsasar", Inc2: "Darío", Inc3: "Ciro", Cita: "Daniel 1:1" },
                { Pregunta: "¿Qué decidieron no comer Daniel y sus amigos?", Correcta: "La comida del rey", Inc1: "Legumbres", Inc2: "Pan", Inc3: "Frutas", Cita: "Daniel 1:8" },
                { Pregunta: "¿Cuántos días duró la prueba de la dieta de legumbres?", Correcta: "10 días", Inc1: "7 días", Inc2: "40 días", Inc3: "3 días", Cita: "Daniel 1:12" },
                // ... agrega hasta 20 por nivel
            ],
            2: [
                { Pregunta: "¿De qué material era la cabeza de la estatua del sueño?", Correcta: "Oro fino", Inc1: "Plata", Inc2: "Bronce", Inc3: "Hierro", Cita: "Daniel 2:32" },
                { Pregunta: "¿Qué destruyó la estatua en el sueño?", Correcta: "Una piedra no cortada con mano", Inc1: "Un rayo", Inc2: "Un terremoto", Inc3: "Un ejército", Cita: "Daniel 2:34" },
            ],
            3: [
                { Pregunta: "¿Cómo se llamaba el horno donde fueron echados los amigos de Daniel?", Correcta: "Horno de fuego ardiendo", Inc1: "Foso de leones", Inc2: "Cárcel de fuego", Inc3: "Caldera de cobre", Cita: "Daniel 3:6" },
                { Pregunta: "¿Cuántos hombres vio el rey caminando en el fuego?", Correcta: "Cuatro", Inc1: "Tres", Inc2: "Cinco", Inc3: "Dos", Cita: "Daniel 3:25" },
            ],
            4: [
                { Pregunta: "¿En qué animal se convirtió Nabucodonosor por su soberbia?", Correcta: "Un buey (comía hierba)", Inc1: "Un león", Inc2: "Un águila", Inc3: "Un lobo", Cita: "Daniel 4:33" },
            ],
            5: [
                { Pregunta: "¿Qué apareció escribiendo en la pared del palacio?", Correcta: "Los dedos de una mano", Inc1: "Un ángel", Inc2: "Una sombra", Inc3: "Un trueno", Cita: "Daniel 5:5" },
            ],
            6: [
                { Pregunta: "¿Por qué Daniel fue echado al foso de los leones?", Correcta: "Por orar a Dios", Inc1: "Por robar", Inc2: "Por insultar al rey", Inc3: "Por traición", Cita: "Daniel 6:10" },
                { Pregunta: "¿Quién cerró la boca de los leones?", Correcta: "Un ángel enviado por Dios", Inc1: "El mismo Daniel", Inc2: "El Rey Darío", Inc3: "Nadie, no tenían hambre", Cita: "Daniel 6:22" },
            ],
            // Niveles 7 al 12 (Completa aquí con la misma estructura)
            7: [{ Pregunta: "¿Cuántas bestias vio Daniel subir del mar?", Correcta: "Cuatro", Inc1: "Tres", Inc2: "Siete", Inc3: "Diez", Cita: "Daniel 7:3" }],
            8: [{ Pregunta: "¿Qué animales vio Daniel pelear en su visión?", Correcta: "Un carnero y un macho cabrío", Inc1: "León y Oso", Inc2: "Águila y Buey", Inc3: "Dragón y Cordero", Cita: "Daniel 8:3" }],
            9: [{ Pregunta: "¿Cuántas semanas proféticas se mencionan?", Correcta: "Setenta semanas", Inc1: "Siete semanas", Inc2: "Doce semanas", Inc3: "Cincuenta semanas", Cita: "Daniel 9:24" }],
            10: [{ Pregunta: "¿Cerca de qué gran río estaba Daniel en su visión?", Correcta: "Hidekel (Tigris)", Inc1: "Éufrates", Inc2: "Nilo", Inc3: "Jordán", Cita: "Daniel 10:4" }],
            11: [{ Pregunta: "¿De qué puntos cardinales eran los reyes que peleaban?", Correcta: "Norte y Sur", Inc1: "Este y Oeste", Inc2: "Cielo y Tierra", Inc3: "Babilonia y Persia", Cita: "Daniel 11:5" }],
            12: [{ Pregunta: "¿Qué personaje se levantará en el tiempo del fin?", Correcta: "Miguel, el gran príncipe", Inc1: "Gabriel", Inc2: "Lucifer", Inc3: "El Rey del Norte", Cita: "Daniel 12:1" }],
        };

        const baseImageUrl = "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80"; // Placeholder pro
        const victoryVideoUrl = "https://www.w3schools.com/html/mov_bbb.mp4"; // Reemplaza por tu GitHub

        let userState = { name: '', isAdmin: false, lives: 5, score: 0, currentQ: 0, dead: false, victory: false };
        let gameState = { isStarted: false, level: 1, difficulty: 5 };
        let currentQuestions = [];

        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');

        window.handleAuth = async () => {
            const name = document.getElementById('login-name').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (!name) return;

            if (name.toLowerCase() === 'admin' && pass === "Daniel777") {
                userState.isAdmin = true;
                initAdmin();
                return;
            }

            userState.name = name;
            await setDoc(doc(db, "participantes", name), { name, score: 0, lives: 5, qIndex: 0, dead: false, lastSeen: Date.now() });
            showView('levels');
            renderLevelGrid();
            listenToSync();
            listenToChat();
        };

        function renderLevelGrid() {
            const grid = document.getElementById('level-grid');
            onSnapshot(doc(db, "config", "global"), (snap) => {
                const global = snap.data() || { level: 1 };
                grid.innerHTML = "";
                for(let i=1; i<=12; i++) {
                    const isActive = (i === global.level);
                    const card = document.createElement('div');
                    card.className = `level-card ${isActive ? 'active' : 'locked'}`;
                    card.innerHTML = `
                        <img src="${baseImageUrl}" alt="Nivel ${i}">
                        <div class="level-overlay-num">${isActive ? '' : i}</div>
                        <div class="absolute top-4 left-4 text-[9px] font-bold text-white/50 uppercase">Misión ${i}</div>
                    `;
                    card.onclick = () => { if(isActive) { document.getElementById('lobby-title').innerText = "CAPÍTULO " + i; showView('lobby'); } };
                    grid.appendChild(card);
                }
            });
        }

        function listenToSync() {
            onSnapshot(doc(db, "config", "global"), async (snap) => {
                const data = snap.data();
                if(!data) return;
                gameState = data;
                if(data.isStarted && !userState.dead && !userState.victory && (document.getElementById('view-lobby').offsetParent !== null)) {
                    userState.lives = data.difficulty;
                    startLocalLevel(data.level);
                } else if(!data.isStarted && (document.getElementById('view-game').offsetParent !== null)) {
                    showView('levels');
                }
            });

            onSnapshot(collection(db, "participantes"), (snap) => {
                const prog = document.getElementById('group-progress');
                if(!prog) return;
                prog.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    const per = (p.qIndex / 20) * 100;
                    prog.innerHTML += `
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between text-[8px] uppercase font-bold tracking-widest text-zinc-600">
                                <span>${p.name}</span> <span>${p.dead ? 'ELIMINADO' : p.qIndex+'/20'}</span>
                            </div>
                            <div class="h-[2px] bg-zinc-900 rounded-full overflow-hidden">
                                <div class="progress-line h-full ${p.dead ? 'bg-red-900' : 'bg-yellow-600'}" style="width:${per}%"></div>
                            </div>
                        </div>`;
                });
            });
        }

        async function startLocalLevel(lvl) {
            // Primero intenta cargar de Firebase (si el admin subió Excel)
            const snap = await getDoc(doc(db, "niveles", "lvl_" + lvl));
            if(snap.exists()) {
                currentQuestions = snap.data().questions;
            } else {
                // Si no hay en Firebase, usa la base de datos LOCAL del código
                currentQuestions = LOCAL_DATA[lvl] || [];
            }
            
            if(currentQuestions.length === 0) return Swal.fire("Error", "Este nivel no tiene preguntas.", "error");
            
            currentQuestions = currentQuestions.sort(() => Math.random() - 0.5).slice(0, 20);
            userState.currentQ = 0;
            userState.score = 0;
            showView('game');
            renderQuestion();
        }

        function renderQuestion() {
            if(userState.currentQ >= currentQuestions.length) {
                userState.victory = true;
                playVictoryVideo();
                return;
            }
            const q = currentQuestions[userState.currentQ];
            document.getElementById('q-meta').innerText = `DESAFÍO ${userState.currentQ + 1} / 20`;
            document.getElementById('q-text').innerText = q.Pregunta;
            document.getElementById('q-cite').innerText = q.Cita;
            document.getElementById('lives-display').innerHTML = "❤️".repeat(userState.lives);
            document.getElementById('score-display').innerText = userState.score;

            const opts = [q.Correcta, q.Inc1, q.Inc2, q.Inc3].sort(() => Math.random() - 0.5);
            const grid = document.getElementById('options-grid');
            grid.innerHTML = "";
            opts.forEach(o => {
                const b = document.createElement('button');
                b.className = "btn-option w-full p-5 rounded-2xl text-left text-xs font-bold uppercase tracking-tighter";
                b.innerText = o;
                b.onclick = () => {
                    const isCorrect = (o === q.Correcta);
                    if(isCorrect) { userState.score += 100; userState.currentQ++; }
                    else { userState.lives--; if(userState.lives <= 0) { userState.dead = true; showGameOver(); } }
                    if(!userState.dead) renderQuestion();
                    updateDoc(doc(db, "participantes", userState.name), { score: userState.score, qIndex: userState.currentQ, dead: userState.dead });
                };
                grid.appendChild(b);
            });
        }

        function playVictoryVideo() {
            const v = document.getElementById('view-victory');
            const p = document.getElementById('vid-player');
            p.src = victoryVideoUrl;
            v.classList.remove('hidden');
            p.play();
        }

        window.backToCamp = () => {
            document.getElementById('view-victory').classList.add('hidden');
            showView('lobby');
        };

        function showGameOver() {
            showView('login');
            Swal.fire({
                title: 'ELIMINADO', text: 'Te comió el león.',
                imageUrl: 'https://media.giphy.com/media/3o7TKMGpxxS06TLLJC/giphy.gif',
                imageWidth: 300, background: '#000', color: '#fff'
            }).then(() => location.reload());
        }

        // --- ADMIN FUNCTIONS ---
        function initAdmin() {
            showView('admin');
            const s = document.getElementById('adm-level');
            for(let i=1; i<=12; i++) s.innerHTML += `<option value="${i}">Misión ${i}</option>`;

            onSnapshot(doc(db, "config", "global"), (snap) => {
                const d = snap.data() || {};
                gameState = d;
                const b = document.getElementById('btn-toggle-game');
                b.innerText = d.isStarted ? "Detener Partida" : "Iniciar Nivel " + (d.level || 1);
            });

            onSnapshot(collection(db, "participantes"), (snap) => {
                const l = document.getElementById('adm-player-list');
                l.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    l.innerHTML += `<div class="p-3 bg-black border border-zinc-900 rounded-xl text-[10px] flex justify-between uppercase">
                        <span>${p.name} - ${p.score} Pts</span>
                        <button onclick="kick('${p.name}')" class="text-red-500">X</button>
                    </div>`;
                });
            });
        }

        window.toggleGameState = async () => {
            await setDoc(doc(db, "config", "global"), {
                isStarted: !gameState.isStarted, 
                level: parseInt(document.getElementById('adm-level').value), 
                difficulty: parseInt(document.getElementById('adm-difficulty').value)
            });
        };

        window.processExcel = (input) => {
            const lvl = document.getElementById('adm-level').value;
            const r = new FileReader();
            r.onload = async (e) => {
                const book = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                await setDoc(doc(db, "niveles", "lvl_" + lvl), { questions: json });
                Swal.fire("Éxito", "Excel cargado.", "success");
            };
            r.readAsArrayBuffer(input.files[0]);
        };

        window.kick = async (n) => { await deleteDoc(doc(db, "participantes", n)); };
        window.globalReset = async () => { await setDoc(doc(db, "config", "global"), { isStarted: false, level: 1, difficulty: 5 }); };

        // --- CHAT ---
        window.sendChatMessage = async () => {
            const i = document.getElementById('chat-input');
            if(!i.value) return;
            await addDoc(collection(db, "chat"), { user: userState.name, text: i.value, time: Date.now() });
            i.value = "";
        };

        function listenToChat() {
            const q = query(collection(db, "chat"), orderBy("time", "desc"), limit(20));
            onSnapshot(q, (snap) => {
                const b = document.getElementById('chat-messages');
                b.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    b.innerHTML += `<div class="mb-2 text-[11px]"><b class="text-yellow-600 uppercase">${m.user}:</b> <span class="text-zinc-400">${m.text}</span></div>`;
                });
            });
        }

        function showView(id) {
            ['view-login', 'view-levels', 'view-lobby', 'view-game', 'view-admin', 'view-victory'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById('view-' + id).classList.remove('hidden');
        }
    </script>
