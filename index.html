<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daniel: El Desafío Profético - Multiverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #d4af37; --bg-dark: #080808; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #f0f0f0; margin: 0; overflow-x: hidden; height: 100vh; }
        .font-royal { font-family: 'Cinzel', serif; }
        
        #video-bg-container { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: hidden; }
        #video-bg-container video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3); }

        #intro-overlay, .fullscreen-video { position: fixed; inset: 0; z-index: 1000; background: black; display: flex; align-items: center; justify-content: center; transition: opacity 1s, visibility 1s; }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; }
        
        #intro-video { object-fit: cover; width: 100%; height: 100%; }

        .btn-gold { 
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 100%); 
            color: #1a1a1a; font-weight: 800; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); text-transform: uppercase;
        }
        
        .card-glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.15); }
        
        @keyframes correct-pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-pop 0.4s ease-out; }

        @keyframes hourglass-spin { 0% { transform: rotate(0deg); } 20% { transform: rotate(180deg); } 100% { transform: rotate(180deg); } }
        .animate-hourglass { animation: hourglass-spin 3s infinite ease-in-out; }

        #flash-overlay { position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        .flash-red { background: rgba(255, 0, 0, 0.4); }
        .flash-green { background: rgba(0, 255, 0, 0.3); }

        .timer-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--gold); transition: width 0.1s linear, background-color 0.3s; }

        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, 1px); } }
        .shake-screen { animation: shake 0.3s infinite; }

        .level-card { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 1.2rem; border: 2px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: 0.5s; filter: brightness(0.2) grayscale(1); }
        .level-card.active { filter: brightness(1) grayscale(0); border: 3px solid var(--gold); }

        .gold-heart { color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); font-size: 1.2rem; margin-right: 4px; }
        .hidden { display: none !important; }

        .footer-anclado { position: relative; width: 100%; text-align: center; padding: 15px; background: linear-gradient(to top, #000, transparent); color: var(--gold); font-size: 10px; letter-spacing: 2px; font-weight: bold; }

        .results-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; align-items: center; padding: 1rem; overflow-y: auto; }
        .btn-option { background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.2); transition: 0.2s; color: white; }
        .btn-option:hover { background: rgba(212,175,55,0.1); border-color: var(--gold); }

        #final-image-screen { position: fixed; inset: 0; z-index: 3000; background-color: black; display: none; align-items: center; justify-content: center; }
        #final-image-content { width: 100%; height: 100%; object-fit: contain; }

        .floating-btn {
            position: fixed; z-index: 500; cursor: pointer;
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--gold); background: rgba(0,0,0,0.8);
            box-shadow: 0 0 15px var(--gold); color: var(--gold); font-size: 20px;
            animation: drift-down 15s linear infinite;
        }
        #f-btn-1 { left: 10%; animation-delay: 0s; }
        #f-btn-2 { left: 50%; animation-delay: 5s; }
        #f-btn-3 { left: 85%; animation-delay: 10s; }

        #floating-card-overlay {
            position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
    </style>
</head>
<body id="game-body">

    <!-- BOTONES FLOTANTES -->
    <div id="floating-btns-group" class="hidden">
        <div id="f-btn-1" class="floating-btn" onclick="openFloatingCard('question')"><i class="fa-solid fa-question"></i></div>
        <div id="f-btn-2" class="floating-btn" onclick="openFloatingCard('book')"><i class="fa-solid fa-book-open"></i></div>
        <div id="f-btn-3" class="floating-btn" onclick="openFloatingCard('heart')"><i class="fa-solid fa-heart"></i></div>
    </div>

    <!-- TARJETA FLOTANTE -->
    <div id="floating-card-overlay">
        <div class="card-glass p-8 rounded-[2.5rem] w-full max-w-sm text-center border-2 border-yellow-500/50">
            <div id="f-card-icon" class="text-5xl text-yellow-500 mb-6"></div>
            <p id="f-card-text" class="text-xl font-semibold mb-4 text-white leading-tight"></p>
            <p id="f-card-sub" class="text-sm italic text-yellow-600 font-bold mb-8 uppercase tracking-widest"></p>
            <button onclick="closeFloatingCard()" class="btn-gold w-full py-3 rounded-xl shadow-xl">Cerrar</button>
        </div>
    </div>

    <div id="flash-overlay"></div>

    <audio id="game-music" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <!-- SONIDOS DESDE GITHUB -->
    <audio id="lion-roar" preload="auto"><source src="https://raw.githubusercontent.com/robertproductions12-developer/BATALLADANIEL/refs/heads/main/lion.mp3" type="audio/mpeg"></audio>
    <audio id="success-sound" preload="auto"><source src="https://raw.githubusercontent.com/robertproductions12-developer/BATALLADANIEL/refs/heads/main/correcta.mp3" type="audio/mpeg"></audio>

    <div id="video-bg-container">
        <video id="bg-video-loop" loop playsinline muted><source src="intro.mp4" type="video/mp4"></video>
    </div>

    <div id="video-outcome" class="fullscreen-video hidden">
        <video id="outcome-player" playsinline class="w-full h-full object-cover"></video>
    </div>

    <!-- PANTALLA DE IMAGEN FINAL -->
    <div id="final-image-screen">
        <img id="final-image-content" src="" alt="Resultado">
        <div class="absolute bottom-10 w-full text-center px-4">
            <button onclick="closeOutcomeVideo()" class="btn-gold w-full max-w-xs py-4 rounded-full shadow-2xl">Volver a la batalla</button>
        </div>
    </div>

    <div id="intro-overlay">
        <video id="intro-video" playsinline autoplay muted loop><source src="intro2.mp4" type="video/mp4"></video>
        <button onclick="endIntro()" class="absolute bottom-20 btn-gold px-12 py-5 rounded-full text-lg z-[1001]">Entrar a la Batalla</button>
    </div>

    <div id="main-content" class="relative z-10 opacity-0 transition-opacity duration-1000 h-screen flex flex-col">
        <div class="flex-grow overflow-y-auto">
            
            <div id="view-login" class="min-h-full flex flex-col items-center justify-center p-6">
                <h1 class="font-royal text-6xl md:text-8xl mb-2 text-yellow-500 text-center drop-shadow-2xl uppercase">Daniel</h1>
                <p class="text-[10px] tracking-[0.6em] mb-12 text-zinc-400 uppercase text-center">El Desafío Profético</p>
                <div class="card-glass p-8 rounded-[2.5rem] w-full max-w-sm">
                    <input type="text" id="login-name" placeholder="Tu Nombre o Usuario Admin" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-lg text-white outline-none">
                    <input type="text" id="login-admin-key" placeholder="ID del Administrador (Invitación)" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-white outline-none">
                    
                    <div id="admin-pass-container" class="hidden">
                        <input type="password" id="login-pass" placeholder="Clave Maestra" class="w-full bg-black/50 border border-zinc-800 p-4 rounded-xl mb-4 text-center text-white outline-none">
                    </div>

                    <button onclick="handleAuth()" class="btn-gold w-full py-4 rounded-xl text-lg font-bold">Comenzar</button>
                    <button onclick="toggleAdminField()" class="text-[10px] mt-6 text-zinc-600 underline uppercase block mx-auto tracking-widest">Panel Administrativo</button>
                </div>
            </div>

            <!-- VISTA NIVELES -->
            <div id="view-levels" class="hidden min-h-screen p-4">
                <header class="flex justify-between items-center mb-6 max-w-7xl mx-auto">
                    <div>
                        <h2 class="font-royal text-2xl text-white uppercase tracking-tighter">Misiones</h2>
                        <p id="player-room-info" class="text-[10px] text-yellow-600 uppercase font-bold"></p>
                    </div>
                    <button onclick="location.reload()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-lg text-xs font-bold border border-red-900/50">SALIR</button>
                </header>
                <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-7xl mx-auto pb-20"></div>
            </div>

            <!-- LOBBY -->
            <div id="view-lobby" class="hidden h-[calc(100vh-80px)] flex flex-col p-4 max-w-4xl mx-auto">
                <div class="card-glass p-4 rounded-2xl mb-3 flex flex-col gap-3 shrink-0">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <h2 id="lobby-title" class="font-royal text-xl text-yellow-500 uppercase">LOBBY</h2>
                        <button onclick="showView('levels')" class="text-[10px] text-yellow-600 underline uppercase font-bold px-2 py-1">Regresar</button>
                    </div>
                    <div id="access-code-prompt" class="flex flex-col sm:flex-row gap-2 w-full">
                        <input type="text" id="join-code-input" placeholder="CÓDIGO DE BATALLA" class="flex-1 bg-black border border-yellow-600/50 p-3 rounded-xl text-center text-yellow-500 font-bold outline-none text-base">
                        <button onclick="validateAccessCode()" class="btn-gold py-3 px-4 rounded-xl text-[10px] whitespace-nowrap">ENTRAR A BATALLA</button>
                    </div>
                    <button id="admin-back-btn" onclick="showView('admin')" class="hidden w-full bg-zinc-800 py-3 rounded-xl text-[10px] uppercase font-bold text-zinc-300 tracking-widest border border-zinc-700">Panel de Mando</button>
                </div>
                <div class="flex-1 card-glass rounded-2xl p-4 mb-3 overflow-y-auto" id="chat-messages" style="min-height: 150px;"></div>
                <div id="lobby-video-container" class="card-glass p-2 rounded-2xl mb-3">
                    <video id="lobby-level-video" class="w-full rounded-xl aspect-video object-cover" controls playsinline><source id="lobby-video-src" src="default.mp4" type="video/mp4"></video>
                </div>
                <div class="flex gap-2 pb-2 shrink-0 w-full items-center">
                    <input type="text" id="chat-input" placeholder="Escribe..." class="flex-1 min-w-0 bg-black border border-zinc-800 p-4 rounded-xl text-white outline-none text-sm">
                    <button onclick="sendChatMessage()" class="btn-gold px-4 py-4 rounded-xl font-bold text-xs flex-shrink-0">ENVIAR</button>
                </div>
            </div>

            <!-- JUEGO -->
            <div id="view-game" class="hidden min-h-full p-4">
                <div class="max-w-3xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <div id="game-lives" class="flex"></div>
                        <div class="text-right">
                            <span id="game-score" class="text-4xl font-bold text-yellow-500 font-royal">0</span><br>
                            <span id="game-timer-label" class="text-sm font-mono text-zinc-400 tracking-widest">00:00</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 mb-8">
                        <div id="hourglass-container">
                            <i id="hourglass-icon" class="fa-solid fa-hourglass-half text-yellow-500 text-2xl animate-hourglass"></i>
                        </div>
                        <div class="timer-container flex-1"><div id="timer-bar"></div></div>
                    </div>
                    <div id="q-card" class="card-glass p-6 md:p-12 rounded-[2.5rem] flex flex-col min-h-[400px] border-t-4 border-yellow-500/50">
                        <p id="q-index" class="text-center text-[10px] text-yellow-600 font-bold mb-6 tracking-[0.3em] uppercase border-b border-white/10 pb-4"></p>
                        <h3 id="q-text" class="text-xl md:text-3xl text-center font-semibold mb-8 leading-tight"></h3>
                        <div id="options-grid" class="grid grid-cols-1 gap-3"></div>
                    </div>
                </div>
            </div>

            <!-- RANKING -->
            <div id="global-results" class="results-overlay hidden">
                <h2 class="font-royal text-3xl md:text-6xl text-yellow-500 mb-6 mt-6 tracking-widest text-center uppercase">Hall de la Gloria</h2>
                <div id="results-list" class="w-full max-w-3xl space-y-3 px-2 pb-20"></div>
                <div class="fixed bottom-10 w-full max-w-xs px-4">
                    <button onclick="location.reload()" class="btn-gold w-full py-4 rounded-full text-sm">Salir del Desafío</button>
                </div>
            </div>

            <!-- PANEL ADMINISTRADOR -->
            <div id="view-admin" class="hidden min-h-screen p-4 overflow-y-auto">
                <div class="max-w-7xl mx-auto pb-20">
                    <div class="flex flex-wrap justify-between items-center gap-6 mb-10">
                        <button onclick="showView('lobby')" class="bg-blue-900/40 text-blue-400 px-8 py-3 rounded-xl border border-blue-900 font-bold text-[10px] uppercase">Chat de Sala</button>
                        <h2 class="font-royal text-3xl text-yellow-500 text-center uppercase">Comando: <span id="admin-id-label">--</span></h2>
                        <button onclick="resetGlobalSystem()" class="bg-red-900/40 text-red-400 px-8 py-3 rounded-xl border border-red-900 font-bold text-[10px] uppercase">Reiniciar Datos Sala</button>
                    </div>

                    <!-- PANEL EXCLUSIVO SUPER ADMIN -->
                    <div id="super-admin-section" class="hidden mb-12 space-y-8">
                        <div class="card-glass p-6 rounded-3xl border-2 border-red-600/40">
                            <h3 class="text-red-500 font-royal mb-6 text-center uppercase tracking-widest">Gestión Global de Salas</h3>
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input type="text" id="new-adm-user" placeholder="Usuario Admin" class="bg-black border border-zinc-700 p-3 rounded-xl text-white text-xs">
                                <input type="password" id="new-adm-pass" placeholder="Clave de Acceso" class="bg-black border border-zinc-700 p-3 rounded-xl text-white text-xs">
                                <input type="text" id="new-adm-room" placeholder="Nombre de Sala" class="bg-black border border-zinc-700 p-3 rounded-xl text-white text-xs">
                                <button onclick="createAdminFirebase()" class="btn-gold py-3 rounded-xl font-bold text-xs uppercase">Registrar Admin</button>
                            </div>
                            <div id="super-admin-list" class="mt-8 space-y-2"></div> <!-- Lista con botón borrar -->
                        </div>

                        <div class="card-glass p-6 rounded-3xl border-2 border-yellow-500/30">
                            <h3 class="text-yellow-500 font-royal mb-6 text-center uppercase text-sm">Carga Global de Preguntas</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="excel-load-grid"></div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
                                <div class="bg-black/40 p-4 rounded-xl text-center">
                                    <p class="text-[10px] mb-3 uppercase font-bold text-zinc-400">Botones Flotantes</p>
                                    <div class="flex gap-2">
                                        <button onclick="triggerFloatExcel('question')" class="bg-zinc-800 text-white flex-1 py-2 rounded text-[8px]">? EXCEL</button>
                                        <button onclick="triggerFloatExcel('book')" class="bg-zinc-800 text-white flex-1 py-2 rounded text-[8px]">LIBRO EXCEL</button>
                                        <button onclick="triggerFloatExcel('heart')" class="bg-zinc-800 text-white flex-1 py-2 rounded text-[8px]">CORAZÓN EXCEL</button>
                                    </div>
                                    <div class="flex gap-2 mt-2">
                                        <button onclick="toggleFloatingGlobal(true)" class="bg-green-900/40 text-green-400 flex-1 py-1 rounded text-[8px] border border-green-600">ACTIVAR</button>
                                        <button onclick="toggleFloatingGlobal(false)" class="bg-red-900/40 text-red-400 flex-1 py-1 rounded text-[8px] border border-red-600">OCULTAR</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="card-glass p-6 rounded-3xl h-fit">
                            <h3 class="text-yellow-500 font-royal mb-6 text-center uppercase text-sm">Configuración de Sala</h3>
                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <div class="bg-black/40 p-4 rounded-xl">
                                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Vidas</label>
                                    <select id="adm-diff" onchange="updateRoomConfig()" class="w-full bg-black border border-zinc-700 p-2 rounded text-white text-xs">
                                        <option value="6">6 Vidas</option><option value="3" selected>3 Vidas</option><option value="1">1 Vida</option>
                                    </select>
                                </div>
                                <div class="bg-black/40 p-4 rounded-xl">
                                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Tiempo</label>
                                    <select id="adm-timer-limit" onchange="updateRoomConfig()" class="w-full bg-black border border-zinc-700 p-2 rounded text-white text-xs">
                                        <option value="15">15 Seg</option><option value="30" selected>30 Seg</option><option value="50">50 Seg</option>
                                    </select>
                                </div>
                            </div>
                            
                            <h4 class="text-yellow-600 font-bold text-center text-[10px] mb-4 uppercase tracking-widest">Misiones y Códigos</h4>
                            <div id="adm-levels-controls" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                            
                            <div class="mt-8 grid grid-cols-2 gap-4">
                                <button onclick="toggleRanking(true)" class="bg-green-600/80 text-black py-4 rounded-xl font-bold uppercase text-[10px]">Publicar Ranking</button>
                                <button onclick="toggleRanking(false)" class="bg-red-700/80 text-white py-4 rounded-xl font-bold uppercase text-[10px]">Quitar Ranking</button>
                            </div>
                        </div>

                        <!-- MONITOR EN TIEMPO REAL -->
                        <div class="card-glass p-6 rounded-3xl h-fit">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-yellow-500 font-royal uppercase text-sm">Monitor de Guerreros</h3>
                                <div id="super-admin-monitor-filter" class="hidden">
                                    <select id="monitor-room-select" onchange="refreshMonitor()" class="bg-black border border-yellow-600/50 p-1 rounded text-white text-[9px] uppercase">
                                        <option value="all">Todas las Salas</option>
                                    </select>
                                </div>
                            </div>
                            <div id="adm-monitor" class="space-y-2 max-h-[600px] overflow-y-auto"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <input type="file" id="adm-excel-input" accept=".xlsx" class="hidden">
        <input type="file" id="float-excel-input" accept=".xlsx" class="hidden">
        <footer class="footer-anclado shrink-0">DESARROLLADO POR - ROBERT PARACO 2026</footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, addDoc, getDoc, getDocs, deleteDoc, writeBatch, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEBobrmLT4Icvjn81GZx1FtkTS9IU2XsI",
            authDomain: "batalladaniel-5ce50.firebaseapp.com",
            projectId: "batalladaniel-5ce50",
            storageBucket: "batalladaniel-5ce50.firebasestorage.app",
            messagingSenderId: "799596753792",
            appId: "1:799596753792:web:90b549b0757cc5481b4765"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const IMAGEN_FINAL = "https://raw.githubusercontent.com/robertproductions12-developer/BATALLADANIEL/refs/heads/main/sii.png";

        const DEFAULT_IMAGES = { "1": "1.jpg", "2": "2.jpg", "3": "3.jpg", "4": "4.jpg", "5": "5.jpg", "6": "6.jpg", "7": "7.jpg", "8": "8.jpg", "9": "9.jpg", "10": "10.jpg", "11": "11.jpg", "12": "12.jpg" };
        const LEVEL_VIDEOS = { "1": "dani.mp4", "2": "dani.mp4", "3": "dani.mp4", "4": "dani.mp4", "5": "dani.mp4", "6": "dani.mp4", "7": "dani.mp4", "8": "dani.mp4", "9": "dani.mp4", "10": "dani.mp4", "11": "dani.mp4", "12": "dani.mp4" };

        let userState = { name: '', isAdmin: false, isSuper: false, adminID: '', roomID: '', lives: 3, score: 0, qIndex: 0, startTime: 0 };
        let roomConfig = { levels: {}, showResults: false, globalLives: 3, timerLimit: 30 };
        let floatingPhrases = { question: [], book: [], heart: [] };
        let activeLevelLobby = 0;
        let currentLevelQuestions = [];
        let questionInterval = null;
        let playersCache = [];

        const gameMusic = document.getElementById('game-music');
        const lionRoar = document.getElementById('lion-roar');
        const successSound = document.getElementById('success-sound');
        const lobbyVideo = document.getElementById('lobby-level-video');
        const outcomePlayer = document.getElementById('outcome-player');

        window.endIntro = () => {
            document.getElementById('intro-overlay').classList.add('fade-out');
            document.getElementById('main-content').classList.replace('opacity-0', 'opacity-100');
            document.getElementById('bg-video-loop').play().catch(()=>{});
            gameMusic.play().catch(()=>{});
        };

        window.showView = (id) => {
            if(questionInterval) clearInterval(questionInterval);
            ['view-login', 'view-levels', 'view-lobby', 'view-game', 'view-admin'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById('view-' + id).classList.remove('hidden');
        };

        window.handleAuth = async () => {
            const name = document.getElementById('login-name').value.trim();
            const adminKey = document.getElementById('login-admin-key').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if (!name) return;

            if (name.toLowerCase() === 'admin' && pass === "Daniel777") {
                userState.isAdmin = true; userState.isSuper = true; userState.adminID = 'SUPER-ADMIN';
                initAdminPanel(); return;
            }

            if (pass) {
                const admSnap = await getDoc(doc(db, "admins", name));
                if (admSnap.exists() && admSnap.data().pass === pass) {
                    userState.isAdmin = true; userState.isSuper = false; 
                    userState.adminID = name; userState.roomID = admSnap.data().roomID;
                    initAdminPanel(); return;
                }
            }

            if (!adminKey) { Swal.fire("ID Requerido", "Ingresa el ID del administrador para entrar", "warning"); return; }
            
            const admRef = await getDoc(doc(db, "admins", adminKey));
            if (!admRef.exists()) { Swal.fire("Error", "ID no válido", "error"); return; }

            userState.name = name; userState.adminID = adminKey; userState.roomID = admRef.data().roomID;
            await setDoc(doc(db, "players", name), { name, score:0, qIndex:0, lives:3, dead:false, time:0, adminID: adminKey, roomID: userState.roomID, lastUpdate: Date.now() });
            
            document.getElementById('player-room-info').innerText = "ID: " + adminKey;
            window.showView('levels'); syncDatabase();
        };

        function syncDatabase() {
            onSnapshot(doc(db, "rooms", "sala_" + userState.roomID), (snap) => {
                roomConfig = snap.data() || { levels: {}, showResults: false, globalLives: 3, timerLimit: 30 };
                renderLevelGrid();
                if(roomConfig.showResults && !userState.isAdmin) {
                    document.getElementById('global-results').classList.remove('hidden');
                    loadRanking();
                } else document.getElementById('global-results').classList.add('hidden');
                
                if(userState.isAdmin) refreshAdminUI();
            });

            onSnapshot(doc(db, "config", "game"), (snap) => {
                const data = snap.data();
                document.getElementById('floating-btns-group').classList.toggle('hidden', !data?.showFloatingGlobal);
            });
            onSnapshot(doc(db, "config", "floating"), (snap) => { if(snap.exists()) floatingPhrases = snap.data(); });

            const chatQ = query(collection(db, "chat"), where("roomID", "==", userState.roomID));
            onSnapshot(chatQ, (snap) => {
                const box = document.getElementById('chat-messages'); box.innerHTML = "";
                snap.docs.reverse().forEach(d => {
                    const m = d.data();
                    box.innerHTML += `<div class="mb-2 text-[10px] bg-white/5 p-2 rounded-lg border-l-2 border-yellow-600"><b class="text-yellow-600">${m.user}:</b> <span class="text-zinc-300 ml-1">${m.text}</span></div>`;
                });
                box.scrollTop = box.scrollHeight;
            });

            const playersQuery = userState.isSuper ? collection(db, "players") : query(collection(db, "players"), where("roomID", "==", userState.roomID));
            onSnapshot(playersQuery, (snap) => {
                playersCache = snap.docs.map(d => d.data());
                refreshMonitor();
            });
        }

        // --- EFECTOS FLASH ---
        function triggerFlash(type) {
            const overlay = document.getElementById('flash-overlay');
            overlay.className = type === 'success' ? 'flash-green' : 'flash-red';
            overlay.style.opacity = '1';
            setTimeout(() => overlay.style.opacity = '0', 200);
        }

        // --- SUPER ADMIN ---
        function initAdminPanel() {
            document.getElementById('admin-back-btn').classList.remove('hidden');
            document.getElementById('admin-id-label').innerText = userState.adminID;
            if(userState.isSuper) {
                document.getElementById('super-admin-section').classList.remove('hidden');
                document.getElementById('super-admin-monitor-filter').classList.remove('hidden');
                const grid = document.getElementById('excel-load-grid'); grid.innerHTML = "";
                for(let i=1; i<=12; i++) {
                    grid.innerHTML += `<button onclick="pickExcel(${i})" class="bg-zinc-800 text-white p-2 rounded text-[8px]">SUBIR NIVEL ${i}</button>`;
                }
                syncSuperAdminLists();
            }
            window.showView('admin'); syncDatabase();
        }

        async function syncSuperAdminLists() {
            onSnapshot(collection(db, "admins"), (snap) => {
                const list = document.getElementById('super-admin-list');
                const select = document.getElementById('monitor-room-select');
                list.innerHTML = ""; select.innerHTML = '<option value="all">Todas las Salas</option>';
                snap.forEach(d => {
                    const a = d.data();
                    list.innerHTML += `<div class="p-2 bg-white/5 rounded flex justify-between items-center text-[10px]">
                        <span><b>${d.id}</b> - Sala: ${a.roomID}</span>
                        <button onclick="deleteAdminRoom('${d.id}', '${a.roomID}')" class="text-red-500 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                    select.innerHTML += `<option value="${a.roomID}">${a.roomID}</option>`;
                });
            });
        }

        window.deleteAdminRoom = async (adminId, roomId) => {
            if(confirm(`¿ELIMINAR SALA ${roomId} Y ADMIN ${adminId}?`)) {
                await deleteDoc(doc(db, "admins", adminId));
                await deleteDoc(doc(db, "rooms", "sala_" + roomId));
                Swal.fire("Borrado", "Sala eliminada", "success");
            }
        }

        window.createAdminFirebase = async () => {
            const u = document.getElementById('new-adm-user').value.trim();
            const p = document.getElementById('new-adm-pass').value.trim();
            const r = document.getElementById('new-adm-room').value.trim();
            if(!u || !p || !r) return;
            await setDoc(doc(db, "admins", u), { pass: p, roomID: r });
            await setDoc(doc(db, "rooms", "sala_" + r), { levels: {}, showResults: false, globalLives: 3, timerLimit: 30, roomID: r }, {merge: true});
            Swal.fire("Éxito", "Sala Creada", "success");
        };

        window.refreshMonitor = () => {
            const cont = document.getElementById('adm-monitor'); cont.innerHTML = "";
            const filter = document.getElementById('monitor-room-select')?.value || 'all';
            const filtered = playersCache.filter(p => filter === 'all' || p.roomID === filter);
            filtered.sort((a,b) => b.score - a.score).forEach(p => {
                cont.innerHTML += `<div class="p-3 bg-black/40 rounded-xl border border-white/5 text-[10px] flex justify-between items-center">
                    <div><b class="${p.dead?'text-red-500':'text-yellow-500'} text-sm uppercase">${p.name}</b><br>
                    <span class="text-zinc-500">SALA: ${p.roomID} | TIEMPO: ${formatTime(p.time)}</span></div>
                    <div class="text-right"><span class="text-white font-bold">PTS: ${p.score}</span><br>
                    <span class="text-blue-400">PREG: ${p.qIndex}/20</span></div>
                </div>`;
            });
        };

        async function loadRanking() {
            const list = document.getElementById('results-list'); list.innerHTML = "";
            const filtered = playersCache.filter(p => p.roomID === userState.roomID).sort((a,b) => b.score - a.score);
            list.innerHTML = filtered.map((p, i) => `
                <div class="card-glass p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-xl font-royal text-yellow-500">#${i+1}</span>
                    <div class="flex-1 px-4"><p class="font-bold uppercase">${p.name}</p><p class="text-[9px] text-zinc-500">TIEMPO: ${formatTime(p.time)}</p></div>
                    <p class="text-xl font-royal text-yellow-500">${p.score}</p>
                </div>`).join('');
        }

        function formatTime(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }

        function refreshAdminUI() {
            const cont = document.getElementById('adm-levels-controls'); cont.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const l = roomConfig.levels?.[i] || { active: false, code: '' };
                cont.innerHTML += `
                    <div class="p-3 bg-white/5 rounded-2xl border border-white/10 flex flex-col gap-2">
                        <div class="flex justify-between items-center"><span class="text-[10px] font-bold uppercase">Nivel ${i}</span>
                        <button onclick="toggleLvl(${i})" class="px-3 py-1 rounded-lg text-[8px] font-black ${l.active?'bg-red-600/20 text-red-500 border border-red-600':'bg-green-600/20 text-green-500 border border-green-600'}">${l.active?'DESACTIVAR':'ACTIVAR'}</button></div>
                        ${l.active ? `<div class="text-center bg-black/60 py-1 rounded-lg text-yellow-500 font-black text-[11px] tracking-widest border border-yellow-500/20">COD: ${l.code}</div>` : ''}
                    </div>`;
            }
            document.getElementById('adm-diff').value = roomConfig.globalLives;
            document.getElementById('adm-timer-limit').value = roomConfig.timerLimit;
        }

        window.toggleLvl = async (lvl) => {
            const lvls = {...(roomConfig.levels || {})};
            const current = lvls[lvl] || { active: false, code: '' };
            current.active = !current.active;
            current.code = current.active ? Math.floor(1000 + Math.random() * 9000).toString() : '';
            lvls[lvl] = current;
            await updateDoc(doc(db, "rooms", "sala_" + userState.roomID), { levels: lvls });
        };

        window.updateRoomConfig = async () => {
            await updateDoc(doc(db, "rooms", "sala_" + userState.roomID), { 
                globalLives: parseInt(document.getElementById('adm-diff').value),
                timerLimit: parseInt(document.getElementById('adm-timer-limit').value)
            });
        };

        window.toggleRanking = async (v) => { await updateDoc(doc(db, "rooms", "sala_" + userState.roomID), { showResults: v }); };

        window.resetGlobalSystem = async () => {
            if(confirm("¿Reiniciar jugadores de esta sala?")) {
                const batch = writeBatch(db);
                const snap = await getDocs(query(collection(db, "players"), where("roomID", "==", userState.roomID)));
                snap.forEach(d => batch.delete(d.ref));
                await batch.commit();
                await updateDoc(doc(db, "rooms", "sala_" + userState.roomID), { levels: {}, showResults: false });
            }
        };

        // --- JUEGO ---
        function renderLevelGrid() {
            const grid = document.getElementById('level-grid'); grid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                const active = roomConfig.levels?.[i]?.active;
                grid.innerHTML += `<div class="level-card ${active ? 'active' : ''}" onclick="enterLobby(${i})"><img src="${DEFAULT_IMAGES[i]}" class="w-full h-full object-cover"></div>`;
            }
        }

        window.enterLobby = (lvl) => {
            activeLevelLobby = lvl;
            document.getElementById('lobby-title').innerText = "CAPÍTULO " + lvl;
            document.getElementById('lobby-video-src').src = LEVEL_VIDEOS[lvl] || "default.mp4";
            lobbyVideo.load(); window.showView('lobby');
        };

        window.validateAccessCode = async () => {
            const input = document.getElementById('join-code-input').value.trim();
            const correct = roomConfig.levels?.[activeLevelLobby]?.code;
            if (activeLevelLobby > 0 && input === correct) startQuiz();
            else Swal.fire("Denegado", "Código Erróneo", "error");
        };

        async function startQuiz() {
            const snap = await getDoc(doc(db, "levels", "lvl_" + activeLevelLobby));
            if(!snap.exists()) { Swal.fire("Error", "No hay preguntas cargadas", "info"); return; }
            currentLevelQuestions = snap.data().questions.sort(() => Math.random() - 0.5).slice(0, 20);
            userState.lives = roomConfig.globalLives || 3; 
            userState.qIndex = 0; userState.score = 0; userState.startTime = Date.now();
            window.showView('game'); runQuiz();
        }

        function runQuiz() {
            if(questionInterval) clearInterval(questionInterval);
            if(userState.qIndex >= currentLevelQuestions.length || userState.lives <= 0) { finishBattle(); return; }
            const q = currentLevelQuestions[userState.qIndex];
            document.getElementById('q-index').innerText = `DESAFÍO ${userState.qIndex+1} / 20`;
            document.getElementById('q-text').innerText = q.Pregunta;
            document.getElementById('game-lives').innerHTML = `<i class="fa-solid fa-heart gold-heart"></i>`.repeat(userState.lives);
            document.getElementById('game-score').innerText = userState.score;
            const grid = document.getElementById('options-grid'); grid.innerHTML = "";
            [q.Correcta, q.Inc1, q.Inc2, q.Inc3].filter(o => o).sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = "btn-option p-4 rounded-2xl text-left text-xs font-bold uppercase";
                b.innerText = o;
                b.onclick = () => {
                    if(o === q.Correcta) { 
                        userState.score += 100; 
                        successSound.currentTime = 0; successSound.play();
                        triggerFlash('success');
                    } else { 
                        userState.lives--; 
                        lionRoar.currentTime = 0; lionRoar.play();
                        triggerFlash('error');
                    }
                    userState.qIndex++; updateStats(); setTimeout(runQuiz, 600);
                };
                grid.appendChild(b);
            });
            startTimer();
        }

        function startTimer() {
            let rem = roomConfig.timerLimit || 30;
            const bar = document.getElementById('timer-bar');
            questionInterval = setInterval(() => {
                rem -= 0.1; bar.style.width = (rem/(roomConfig.timerLimit||30))*100 + "%";
                if(rem <= 0) { 
                    clearInterval(questionInterval); 
                    userState.lives--; 
                    lionRoar.play(); triggerFlash('error');
                    updateStats(); runQuiz(); 
                }
            }, 100);
        }

        async function updateStats() {
            const time = Math.floor((Date.now() - userState.startTime)/1000);
            await updateDoc(doc(db, "players", userState.name), { score: userState.score, qIndex: userState.qIndex, lives: userState.lives, dead: userState.lives <= 0, time: time, lastUpdate: Date.now() });
        }

        let targetLvl = 1;
        window.pickExcel = (l) => { targetLvl = l; document.getElementById('adm-excel-input').click(); };
        document.getElementById('adm-excel-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const book = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                const data = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                await setDoc(doc(db, "levels", "lvl_" + targetLvl), { questions: data });
                Swal.fire("Éxito", "Nivel Actualizado", "success");
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        window.triggerFloatExcel = (t) => { window.floatT = t; document.getElementById('float-excel-input').click(); };
        document.getElementById('float-excel-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const book = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                const data = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);
                const update = {}; update[window.floatT] = data;
                await updateDoc(doc(db, "config", "floating"), update);
                Swal.fire("Éxito", "Flotantes cargados", "success");
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        window.toggleFloatingGlobal = async (v) => { await updateDoc(doc(db, "config", "game"), { showFloatingGlobal: v }); };
        window.sendChatMessage = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "chat"), { user: userState.isAdmin ? 'LÍDER' : userState.name, text: i.value, roomID: userState.roomID, time: Date.now() });
            i.value = "";
        };

        window.toggleAdminField = () => document.getElementById('admin-pass-container').classList.toggle('hidden');
        window.closeOutcomeVideo = () => { document.getElementById('final-image-screen').style.display = "none"; window.showView('levels'); };
        
        window.finishBattle = () => { 
            gameMusic.pause(); 
            outcomePlayer.src = userState.lives > 0 ? "gano.mp4" : "perdio.mp4"; 
            document.getElementById('video-outcome').classList.remove('hidden'); 
            outcomePlayer.play(); 
            outcomePlayer.onended = () => { 
                document.getElementById('video-outcome').classList.add('hidden'); 
                document.getElementById('final-image-content').src = IMAGEN_FINAL;
                document.getElementById('final-image-screen').style.display = 'flex'; 
            }; 
        };

        window.openFloatingCard = (t) => {
            const p = floatingPhrases[t]; if(!p || p.length === 0) return;
            const r = p[Math.floor(Math.random()*p.length)];
            document.getElementById('f-card-icon').innerHTML = `<i class="fa-solid fa-${t==='question'?'question':t==='book'?'book-open':'heart'}"></i>`;
            document.getElementById('f-card-text').innerText = r.Frase || r.Texto;
            document.getElementById('f-card-sub').innerText = r.Referencia || r.Cita;
            document.getElementById('floating-card-overlay').style.display = 'flex';
        };
        window.closeFloatingCard = () => document.getElementById('floating-card-overlay').style.display = 'none';
    </script>
</body>
</html>
